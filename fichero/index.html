function geoApply(r,out){const g=geoRoles();let n=0;for(const [k,v] of Object.entries(out)){if(g[k]&&v!==undefined){r[g[k]]=v;n++;if(FD(g[k])?.compartido)propagate(r)}}return n}

// ---------- con internet: OpenStreetMap (Nominatim) ----------
const geoQueryOf=r=>{const g=geoRoles();const d=g.direccion?String(r[g.direccion]||'').trim():'';return d?d:txt(r,S.roles.titulo)};
function geoCached(r){const c=ST.geo?.cache?.[gk_(geoQueryOf(r))];return c&&(c.estado||c.ciudad)?{...c,fuente:'OpenStreetMap'}:null}
let geoLast=0;
async function geoOnline(q){ST.geo.cache=ST.geo.cache||{};const key=gk_(q);if(ST.geo.cache[key])return ST.geo.cache[key];
  const wait=Math.max(0,geoLast+1100-Date.now());if(wait)await new Promise(r=>setTimeout(r,wait));geoLast=Date.now();
  const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=1&countrycodes=mx&accept-language=es&q=${encodeURIComponent(q)}`;
  const res=await fetch(url,{headers:{'Accept':'application/json'}});if(!res.ok)throw new Error('El servicio respondió '+res.status);
  const j=await res.json();const a=j[0]?.address||{};
  const estado=geoEstado(a.state||a['ISO3166-2-lvl4']||'')||(a.city==='Ciudad de México'?'Ciudad de México':'');
  const ciudad=canonCity(a.city||a.town||a.village||a.municipality||a.county||'',estado);
  const out={estado,ciudad};ST.geo.cache[key]=out;return out}

// ---------- listas de sugerencias ----------
function geoLists(estado){const el=$('#geoLists');if(!el||!geoOn())return;const K=geoKnown();const g=geoRoles();
  const usados=g.ciudad?R.filter(r=>!estado||geoEstado(r[g.estado])===estado).map(r=>String(r[g.ciudad]||'').trim()).filter(Boolean):[];
  const cat=estado?[...(GEO_MX[estado]||[]),...Object.entries(GEO_CIUDADES).filter(([,e])=>e===estado).map(([c])=>c)]:Object.keys(GEO_CIUDADES);
  const ciudades=[...new Set([...usados.sort((a,b)=>a.localeCompare(b,'es')),...cat.sort((a,b)=>a.localeCompare(b,'es'))])];
  const regs=[...new Set([...K.regiones,...Object.values(ST.geo?.regiones||{})])];
  const opt=a=>a.map(v=>`<option value="${esc(v)}">`).join('');
  el.innerHTML=`<datalist id="dl-geo-estado">${opt(GEO_ESTADOS)}</datalist><datalist id="dl-geo-ciudad">${opt(ciudades)}</datalist><datalist id="dl-geo-region">${opt(regs)}</datalist>`}
// tras editar un campo de ubicación: normaliza y completa lo vacío del mismo registro
function geoAfterEdit(r,fid){if(!r||!geoOn())return [];const role=geoRoleOf(fid);if(!role)return [];
  const {out}=geoSuggest(r);const g=geoRoles();const keep={};
  for(const [k,v] of Object.entries(out)){if(k===role&&role!=='estado'&&role!=='ciudad')continue;keep[k]=v}
  // no reescribir lo que el usuario acaba de teclear salvo para normalizar estado/ciudad
  if(!Object.keys(keep).length)return [];geoApply(r,keep);return Object.keys(keep).map(k=>g[k])}

// ---------- revisión de todos los registros ----------
let geoReview=null;
function openGeoReview(){const K=geoKnown();const rows=[];
  R.forEach(r=>{const s=geoSuggest(r,K);for(const [k,v] of Object.entries(s.out))rows.push({id:r.id,k,de:s.cur[k],a:v,why:s.why[k],on:true})});
  const sin=R.filter(r=>{const s=geoSuggest(r,K);const g=geoRoles();return (g.ciudad&&!s.cur.ciudad&&!s.out.ciudad)||(g.estado&&!s.cur.estado&&!s.out.estado)});
  geoReview={rows,sin:sin.map(r=>r.id)};renderGeoReview()}
function renderGeoReview(msg=''){const {rows,sin}=geoReview;const lab={estado:'Estado',ciudad:'Ciudad',region:'Región'};const online=ST.geo?.proveedor==='osm';
  openId=null;$('#drawerRoot').innerHTML=`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="gvT" style="width:min(900px,calc(100% - 32px))">
   <div class="dr-head"><div style="flex:1"><h2 id="gvT">Revisar ubicaciones</h2><p>Solo se llenan campos vacíos y se unifican nombres (por ejemplo “CDMX” → “Ciudad de México”). Quita la palomita de lo que no quieras cambiar.</p></div><button class="btn sm" data-close>Cerrar</button></div>
   <div class="dr-body">${msg?`<p class="shared-note">${esc(msg)}</p>`:''}
    ${rows.length?`<div style="overflow:auto"><table class="maptable"><thead><tr><th><input type="checkbox" data-gvall checked aria-label="Todos"></th><th>${esc(cap(word()))}</th><th>Campo</th><th>Ahora</th><th>Queda</th><th>De dónde sale</th></tr></thead><tbody>
      ${rows.map((x,i)=>`<tr><td><input type="checkbox" data-gv="${i}" ${x.on?'checked':''}></td><td>${esc(titleOf(byId(x.id)))}</td><td>${lab[x.k]}</td><td style="color:var(--muted)">${esc(x.de||'—')}</td><td><b>${esc(x.a)}</b></td><td style="color:var(--muted);font-size:12px">${esc(x.why||'')}</td></tr>`).join('')}</tbody></table></div>`
      :'<p class="hint">No hay nada que completar ni unificar.</p>'}
    ${sin.length?`<p class="hint" style="margin-top:12px"><b>${sin.length} sin resolver</b> (sin dirección ni nombre de ciudad reconocible): ${sin.slice(0,12).map(id=>esc(titleOf(byId(id)))).join(', ')}${sin.length>12?'…':''}.</p>`:''}
    <div class="imgacts" style="margin-top:14px">${rows.length?`<button class="btn primary" data-gvgo>Aplicar ${rows.filter(x=>x.on).length} cambios</button>`:''}
      ${sin.length&&online?`<button class="btn" data-gvnet>Buscar ${sin.length} en internet</button>`:''}
      ${sin.length&&!online?`<span class="hint">Activa la búsqueda en internet en Campos › Ubicación automática para intentar con OpenStreetMap.</span>`:''}</div>
    ${online?`<p class="hint">Búsqueda en internet: datos © colaboradores de OpenStreetMap (Nominatim), una consulta por segundo.</p>`:''}
   </div></div>`}
function initGeoEvents(){
  if(!$('#geoLists')){const d=document.createElement('div');d.id='geoLists';d.hidden=true;document.body.appendChild(d)}
  // la lista de ciudades se ajusta al estado del registro que se está editando
  document.addEventListener('focusin',e=>{const t=e.target;if(!t.dataset?.geo||!P)return;const g=geoRoles();
    const r=byId(t.closest('tr[data-id]')?.dataset.id||openId);geoLists(r&&g.estado?geoEstado(r[g.estado]):'')});
  const after=(r,fid,inDrawer)=>{const ch=geoAfterEdit(r,fid);if(!ch.length)return;save();
    if(inDrawer)ch.forEach(f=>{const i=$('#f-'+f);if(i)i.value=r[f]??''});else refreshRows(r);
    toast('Ubicación completada: '+ch.map(f=>FD(f)?.etiqueta).join(', '))};
  $('#drawerRoot').addEventListener('change',e=>{const k=e.target.dataset?.k;if(!k||!openId)return;if(geoRoleOf(k))after(byId(openId),k,true)});
  $('#view-base').addEventListener('change',e=>{const k=e.target.dataset?.txtc;if(!k)return;const r=byId(e.target.closest('tr[data-id]')?.dataset.id);if(geoRoleOf(k))after(r,k,false)});
  $('#drawerRoot').addEventListener('click',async e=>{const t=e.target;
    const b=t.closest('[data-geofill]');if(b){const r=byId(openId);if(!r)return;let {out}=geoSuggest(r);const g=geoRoles();
      if((g.ciudad&&!r[g.ciudad]&&!out.ciudad)||(g.estado&&!r[g.estado]&&!out.estado)){if(ST.geo?.proveedor==='osm'){b.disabled=true;b.textContent='Buscando…';
        try{await geoOnline(geoQueryOf(r)+', México');out=geoSuggest(r).out}catch(err){say('No se pudo consultar OpenStreetMap ('+err.message+'). Revisa tu conexión.')}}}
      const n=geoApply(r,out);if(n){save();openDrawer(r.id);toast(`Ubicación completada (${n} campos)`)}else{b.disabled=false;b.textContent='Completar ubicación';toast('No encontré más datos de ubicación para completar')}return}
    const gv=t.closest('[data-gv]');if(gv){geoReview.rows[+gv.dataset.gv].on=gv.checked;const go=$('[data-gvgo]');if(go)go.textContent=`Aplicar ${geoReview.rows.filter(x=>x.on).length} cambios`;return}
    if(t.closest('[data-gvall]')){const on=t.checked;geoReview.rows.forEach(x=>x.on=on);renderGeoReview();return}
    if(t.closest('[data-gvgo]')){const by={};geoReview.rows.filter(x=>x.on).forEach(x=>{(by[x.id]=by[x.id]||{})[x.k]=x.a});let n=0;
      for(const [id,o] of Object.entries(by)){const r=byId(id);if(r)n+=geoApply(r,o)}save();closeOverlay();toast(`${n} datos de ubicación actualizados`);return}
    const nb=t.closest('[data-gvnet]');if(nb){nb.disabled=true;let ok=0,fail=0,i=0;const ids=[...geoReview.sin];
      for(const id of ids){const r=byId(id);i++;nb.textContent=`Buscando ${i} de ${ids.length}…`;try{const x=await geoOnline(geoQueryOf(r)+', México');if(x.estado||x.ciudad)ok++;else fail++}catch(err){fail++;if(i===1){say('No se pudo consultar OpenStreetMap ('+err.message+'). Revisa tu conexión.');break}}}
      save();openGeoReview();renderGeoReview(`Internet: ${ok} encontradas, ${fail} sin resultado. Revisa la lista antes de aplicar.`)}});
  $('#view-campos').addEventListener('change',e=>{const t=e.target;
    if(t.matches('[data-geoon]')){ST.geo.activo=t.checked;save();renderCampos();return}
    if(t.dataset.georole){S.roles.geo={...geoRoles(),[t.dataset.georole]:t.value};save();renderCampos();return}
    if(t.matches('[data-geoprov]')){ST.geo.proveedor=t.value;save();return}
    if(t.matches('[data-geoest]')){ST.geo.regionEstado=t.checked;save();return}
    if(t.dataset.georeg){ST.geo.regiones=ST.geo.regiones||{};const v=t.value.trim();if(v)ST.geo.regiones[t.dataset.georeg]=v;else delete ST.geo.regiones[t.dataset.georeg];save();return}});
  $('#view-campos').addEventListener('click',e=>{if(e.target.closest('[data-georev]'))openGeoReview()})}

function moveBefore(id,beforeId){ST.orden=ST.orden.filter(x=>x!==id);const k=beforeId?ST.orden.indexOf(beforeId):-1;if(k<0)ST.orden.push(id);else ST.orden.splice(k,0,id)}
async function delMarker(i){const m=ST.marcadores[i];const n=Object.values(ST.marcas).filter(x=>x===m.id).length;
  if(n&&!await askYes(`“${m.nombre}” está en ${n} hojas. ¿Borrarla y quitarla de esas hojas?`,'Borrar',true))return false;
  ST.marcadores.splice(i,1);for(const k in ST.marcas)if(ST.marcas[k]===m.id)delete ST.marcas[k];ST.ocultar.marcas=(ST.ocultar.marcas||[]).filter(x=>x!==m.id);return true}

      const keep=fields(f=>f.tipo==='parrafo'&&f.id==='notas')[0]?.id||'';const n=mergeFields(a,b,'b',keep);FD(a).etiqueta='Nombre';save();renderCatalog();toast(`Listo: un solo nombre (${n} cambiados)`);return}

  v.addEventListener('input',e=>{const t=e.target;
    if(t.matches('[data-mknote]')){ST.marcaNotas[curPage]=t.value;save();clearTimeout(rpT);rpT=setTimeout(()=>{const w=$(`.pwrap[data-pid="${curPage}"] .pbox`);if(!w)return;let n=$('.mk-note',w);if(!t.value){n?.remove();return}if(!n){n=document.createElement('div');n.className='mk-note';w.appendChild(n)}n.textContent=t.value},150);return}

    if(t.dataset.ck){const r=byId(t.dataset.id);r[t.dataset.ck]=t.value;if(FD(t.dataset.ck)?.compartido)propagate(r);save();refreshPagesOnly()}});
  v.addEventListener('change',e=>{const t=e.target;
    if(t.dataset.diseno){const r=byId(t.dataset.diseno);r._diseno=t.value;save();renderCatalog();toast(t.value?`La hoja usa el diseño de ${t.value}`:'La hoja usa el diseño de su marca');return}

  v.addEventListener('toggle',e=>{const d=e.target;if(d.tagName!=='DETAILS')return;if(d.open)openSecs.add(d.dataset.s);else openSecs.delete(d.dataset.s)},true);

// ---------- PDF (cada hoja como imagen, armado con un escritor mínimo de PDF) ----------
function jpegsToPdf(jpgs){const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
  const push=x=>{const b=typeof x==='string'?enc.encode(x):x;parts.push(b);len+=b.length};
  const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('\nendobj\n')};
  push('%PDF-1.4\n');const n=jpgs.length;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push(`<< /Type /Pages /Count ${n} /Kids [${jpgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')}] >>`));
  jpgs.forEach((j,i)=>{const p=3+3*i,c='q 612 0 0 792 0 0 cm /Im0 Do Q';
    obj(p,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /XObject << /Im0 ${p+2} 0 R >> >> /Contents ${p+1} 0 R >>`));
    obj(p+1,()=>push(`<< /Length ${c.length} >>\nstream\n${c}\nendstream`));
    obj(p+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.bytes.length} >>\nstream\n`);push(j.bytes);push('\nendstream')})});
  const xref=len,total=3+3*n;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let k=1;k<total;k++)x+=String(offs[k]).padStart(10,'0')+' 00000 n \n';
  push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}
function dataUrlBytes(d){const b=atob(d.split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
let pdfBusy=false;
async function exportPDF(){if(pdfBusy)return;if(!window.htmlToImage){say('No se pudo cargar el generador de PDF. Usa “Imprimir” y elige “Guardar como PDF”.');return}
  pdfBusy=true;const btn=$('#pdfBtn');const lbl=btn.textContent;btn.disabled=true;
  const stage=document.createElement('div');stage.style.cssText='position:fixed;left:-20000px;top:0;width:816px;z-index:-1';document.body.appendChild(stage);
  try{const {pages,pn}=plan();const ctx={pn,idxTotal:pages.filter(p=>p.t==='index').length};
    stage.innerHTML=pages.map(p=>pageHTML(p,ctx)).join('');fitTitles(stage);try{await document.fonts.ready}catch(e){}
    await Promise.all($$('img',stage).map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const els=$$('.page',stage);let fontCSS='';try{fontCSS=await htmlToImage.getFontEmbedCSS(els[0])}catch(e){fontCSS=''}
    const out=[];const pr=+(ST.ui.pdfCalidad||2);
    for(let i=0;i<els.length;i++){btn.textContent=`Generando ${i+1} de ${els.length}…`;
      const d=await htmlToImage.toJpeg(els[i],{quality:.9,pixelRatio:pr,width:816,height:1056,backgroundColor:'#ffffff',fontEmbedCSS:fontCSS||undefined,skipFonts:!fontCSS,cacheBust:false});
      out.push({bytes:dataUrlBytes(d),w:Math.round(816*pr),h:Math.round(1056*pr)})}
    const name=fileName(ST.ui.pdfNombre||C_().portada.titulo||P.nombre);download(`${name}_${today()}.pdf`,jpegsToPdf(out),'application/pdf');toast(`PDF descargado (${out.length} páginas)`)}
  catch(err){console.error(err);say('No se pudo generar el PDF ('+(err&&err.message||err)+'). Usa “Imprimir” y elige “Guardar como PDF”.')}
  finally{stage.remove();btn.textContent=lbl;btn.disabled=false;pdfBusy=false}}
function buildPrint(){const {pages,pn}=plan();const ctx={pn,idxTotal:pages.filter(p=>p.t==='index').length};$('#print').innerHTML=pages.map(p=>pageHTML(p,ctx)).join('');$('#print').style.display='block';fitTitles($('#print'));$('#print').style.display=''}
async function doPrint(){buildPrint();try{await document.fonts.ready}catch(e){}await Promise.all($$('#print img').map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));setTimeout(()=>window.print(),120)}
window.addEventListener('beforeprint',()=>{if(P&&!$('#print').innerHTML)buildPrint()});
window.addEventListener('afterprint',()=>{$('#print').innerHTML=''});

function parseCSV(text){text=text.replace(/^﻿/,'');const first=text.split(/\r?\n/)[0]||'';
  const cnt=d=>{let n=0,q=false;for(const ch of first){if(ch==='"')q=!q;else if(!q&&ch===d)n++}return n};
  const d=[',',';','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''))}
const csvCell=v=>{if(v===true)v='Sí';if(v===false)v='No';v=String(v??'');return /[",\n;\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function csvColumns(){const cols=[['ID',r=>r.id]];
  S.campos.forEach(f=>{if(f.tipo==='imagen')return;
    if(f.tipo==='estado'){cols.push([f.etiqueta,r=>r[f.id]?.estado??''],[`${f.etiqueta} (cantidad)`,r=>r[f.id]?.cant??''],[`${f.etiqueta} (notas)`,r=>r[f.id]?.notas??''])}
    else cols.push([f.etiqueta+(f.tipo==='numero'&&f.unidad?` (${f.unidad})`:''),r=>f.tipo==='casilla'?(r[f.id]?'Sí':'No'):r[f.id]??''])});
  cols.push(['En catálogo',r=>r._cat?'Sí':'No'],['Marca de revisión',r=>mkOf(r.id)?.nombre||''],['Nota de la marca',r=>ST.marcas[r.id]?ST.marcaNotas[r.id]||'':''],
    ...(linksOn()?[['Vinculado con',r=>others(r).map(titleOf).join(' | ')]]:[]));return cols}

  const csv='﻿'+cols.map(c=>csvCell(c[0])).join(',')+'\n'+L.map(r=>cols.map(([,fn])=>csvCell(fn(r))).join(',')).join('\n');

function inferType(vals){const v=vals.map(x=>String(x??'').trim()).filter(Boolean);if(!v.length)return 'texto';
  if(v.every(x=>/^https?:\/\//i.test(x)))return 'enlace';if(v.every(x=>/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(x)))return 'correo';
  if(v.every(x=>/^(s[ií]|no|true|false|x|verdadero|falso)$/i.test(x)))return 'casilla';
  if(v.every(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)))return 'fecha';
  if(v.every(x=>num(x)!==null&&/^[\s$\-\d.,]+$/.test(x)))return 'numero';
  const d=new Set(v);if(d.size<=15&&v.length>=d.size*2)return 'lista';
  if(v.some(x=>x.length>80))return 'parrafo';return 'texto'}

function autoTarget(h){const full=norm(h).trim();const n=full.replace(/\s*\([^()]*\)\s*$/,'').trim();
  if(n==='id')return '_id';if(n==='en catalogo')return '_cat';if(n==='marca de revision')return '_mk';if(n==='nota de la marca')return '_mknote';if(n==='vinculado con')return '';

  const find=k=>fields(f=>norm(f.etiqueta)===k||norm(f.id)===k)[0];
  const f=find(full)||find(n)||fields(f=>f.tipo==='numero'&&f.unidad&&norm(`${f.etiqueta} (${f.unidad})`)===full)[0];

function runCSVImport(){const {head,data}=csvPending;const map=$$('[data-map]').map(s=>s.value);const upd=$('#ciUpd')?.checked;const fresh=S.campos.length===0;

  fd('grupo').opciones=gr.map(v=>({v,t:'na'}));
  fd('porVerificar').tabla=true;
  o.R=j.records.map(x=>{const r={...x};r.grupo=r.grupo==='Agencia de marca'?'Nuevos':r.grupo;
    r._cat=!!x.enCatalogo;r._vinc=x.vinculo||'';r._orden=x.orden??0;r._ajuste=x.fachadaAjuste||{modo:'cubrir',escala:100,x:50,y:50,sombra:false};r._fondo=x.fondo||'';
    ['enCatalogo','vinculo','orden','fachadaAjuste','fondo'].forEach(k=>delete r[k]);

  // ajustes
  Object.assign(st,{marcadores:Array.isArray(old.marcadores)?old.marcadores:st.marcadores,marcas:old.marcas||{},marcaNotas:old.marcaNotas||{},descartados:old.descartados||[],orden:old.orden||[]});
  if(old.ocultar)st.ocultar={activo:!!old.ocultar.activo,marcas:old.ocultar.marcas||[],opciones:{planos:old.ocultar.planos||[],estatus:old.ocultar.estatus||[]}};
  if(old.ui){const u=old.ui;Object.assign(st.ui,{tema:u.tema==='car4u'?'negro':(u.tema||'claro'),acento:u.acento||'',densidad:u.densidad||'normal',escala:u.escala||100,historial:u.historial||30,zoomCat:u.zoomCat||'.42',pdfCalidad:u.pdfCalidad||2,pdfNombre:u.pdfNombre||''});
    if(u.graf)Object.assign(st.ui.graf,u.graf);const c=u.cols||{};
    if(c.foto===false)st.ui.sys.thumb=false;if(c.revision===false)st.ui.sys.marca=false;
    ['region','estatus','planos','terreno','construccion','taller'].forEach(k=>{if(c[k]===false)fd(k).tabla=false});if(c.lev===false){fd('levArq').tabla=false;fd('levEq').tabla=false}if(c.fachada!==false)fd('fotoFachada').tabla=true}
  const mapC=k=>({compartido:'_vinc',catalogo:'_cat',revision:'_mk',foto:'_img',m2:''}[k]??k);
  if(Array.isArray(old.graficas))st.graficas=old.graficas.map(g=>({...g,campo:mapC(g.campo)||'grupo',serie:mapC(g.serie||'')}));
  const C=st.catalogo,I=old.indice||{},Pt=old.portada||{};
  Object.assign(C,{etiqueta:old.etiqueta||C.etiqueta,marcaAgua:old.marcaAgua!==false,numerar:old.numerar!==false,fondoDefault:old.fondoDefault||'',logos:{...(old.logos||{})},plantillas:{...(old.plantillas||{})},acentos:{...(old.acentos||{})},sinLogo:'texto',acento:'#1DB43C'});
  if(C.logos._default&&!C.logos.CAR4U)C.logos.CAR4U=C.logos._default;
  C.portada=mergeDefaults(C.portada,Pt);
  C.indice=mergeDefaults(C.indice,{mostrar:I.mostrar!==false,titulo:I.titulo||'Índice',subtitulo:I.subtitulo||'',fondo:I.fondo||'',aclarar:I.aclarar??80,encabezado:I.encabezado!==false,columnas:+I.columnas||1,letra:I.letra||15.5,numeros:I.numeros!==false,acento:I.acento||'',
    categoria:(I.orden==='cat_alfa'||I.agrupar==='grupo')?'grupo':'',agrupar:(!I.agrupar||I.agrupar==='grupo'||I.agrupar==='ninguno')?'':I.agrupar,orden:I.orden==='cat_alfa'||I.orden==='alfa'?'alfa':'manual',campoExtra:I.ciudad===false?'':'ciudad'});
  o.R.forEach(r=>{if(!r.id)r.id='r-'+uid()});
  const h=hydrate(o);
  return {...h,imgs:j.imgs||{}}}

/* ============================================================
   APP: pestañas, menú, pantalla de proyectos y arranque
   ============================================================ */
// Registro de pestañas. Para agregar una: VIEWS.push({id,label,render,init})
const VIEWS=[
  {id:'base',label:'Base de datos',render:renderBase,init:initBaseEvents},
  {id:'graf',label:'Gráficas',render:renderCharts,init:initChartEvents},
  {id:'cat',label:'Catálogo',render:renderCatalog,init:initCatalogEvents},
  {id:'campos',label:'Campos',render:renderCampos,init:initCamposEvents},
  {id:'conf',label:'Configuración',render:renderConf,init:initConfEvents}
];
let curView='home';
function renderCurrent(){if(!P||curView==='home'){renderHome();return}const v=VIEWS.find(x=>x.id===curView);if(v)v.render()}
function showView(id){curView=id;try{localStorage.setItem('fichero:view',id)}catch(e){}
  $$('#main>section').forEach(s=>s.classList.toggle('hidden',s.id!=='view-'+id));
  $$('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.tab===id));
  const inP=!!P&&id!=='home';$('#tabs').classList.toggle('hidden',!P);$('#histGrp').classList.toggle('hidden',!P);
  $('#projName').textContent=P?P.nombre:'Proyectos';renderMenu();renderCurrent();window.scrollTo(0,0)}
function buildShell(){$('#main').innerHTML=`<section id="view-home"></section>`+VIEWS.map(v=>`<section id="view-${v.id}" class="hidden"></section>`).join('');
  $('#tabs').innerHTML=VIEWS.map(v=>`<button class="tab" role="tab" aria-selected="false" data-tab="${v.id}">${esc(v.label)}</button>`).join('');
  $('#appName').textContent=APP.nombre}
function renderMenu(){const p=!!P;
  $('#menuPop').innerHTML=`${p?`<button data-act="export-json">Descargar proyecto (.json)</button>
    <button data-act="export-csv">Exportar a Excel (.csv)</button>
    <button data-act="import-csv">Importar CSV a este proyecto</button><hr>
    <button data-act="export-tpl">Guardar como plantilla vacía (.json)</button><hr>`:''}
    <button data-act="import-json">Abrir archivo de proyecto (.json)…</button>
    <button data-act="new">Proyecto nuevo…</button>
    <button data-act="home">Ver todos los proyectos</button>`}
async function runAction(a){$('#menuPop').classList.add('hidden');
  if(a==='export-json')return exportProject(false);if(a==='export-tpl')return exportProject(true);
  if(a==='export-csv')return exportCSV();
  if(a==='import-csv'){csvMode='into';$('#csvInput').click();return}
  if(a==='import-json'){$('#jsonInput').click();return}
  if(a==='sites')return openSites();
  if(a==='new')return openNewProject();
  if(a==='home')return goHome()}
async function goHome(){if(saveT)await flushSave();P=null;S=null;R=[];ST=null;clearImgs();resetHistory();applyUI();closeOverlay(true);try{await DB.del('meta:last')}catch(e){}showView('home')}

// ---------- abrir proyecto ----------
// Ajuste único para proyectos con la estructura del Directorio de sucursales/agencias:
// un solo nombre (el del catálogo), descripción y foto en Identificación,
// Metros cuadrados penúltimo y Revisión técnica al final de la ficha.
function upgradeDirectorioLayout(){
  if(S._layoutDir2||!FD('planos')||!FD('nombre')||!S.secciones.some(s=>s.id==='rev')||!S.secciones.some(s=>s.id==='ident'))return false;
  if(FD('nombreCatalogo')&&S.roles.titulo==='nombre')mergeFields('nombre','nombreCatalogo','b',FD('notas')?'notas':'');
  if(ST.catalogo.campoTitulo===S.roles.titulo)ST.catalogo.campoTitulo='';
  FD('nombre').etiqueta='Nombre (base y catálogo)';
  // descripción y foto a Identificación (al final de esa sección)
  const mv=['descripcion','fotoFachada'].filter(id=>FD(id));mv.forEach(id=>{const f=FD(id);S.campos.splice(S.campos.indexOf(f),1);f.seccion='ident';
    const last=S.campos.map(x=>x.seccion).lastIndexOf('ident');S.campos.splice(last+1,0,f)});
  // el nombre primero dentro de Identificación
  const n=FD('nombre');S.campos.splice(S.campos.indexOf(n),1);n.seccion='ident';S.campos.splice(Math.max(0,S.campos.findIndex(x=>x.seccion==='ident')),0,n);
  // quitar secciones que quedaron vacías (no fijas) y ordenar
  S.secciones=S.secciones.filter(s=>isFija(s.id)||fields(f=>f.seccion===s.id).length);
  const by=id=>S.secciones.find(s=>s.id===id);const tail=['_vinc','_catalogo','m2','rev'].map(by).filter(Boolean);
  S.secciones=[...S.secciones.filter(s=>!tail.includes(s)),...tail];
  S._layoutDir2=true;reindex();return true}
async function openProject(pid){if(saveT)await flushSave();const d=await DB.get('p:'+pid);if(!d){toast('No se encontró ese proyecto');return}
  const o=hydrate(d);P=o.P;S=o.S;R=o.R;ST=o.ST;reindex();normalizeRecords();clearImgs();
  for(const [k,v] of Object.entries(await projectImgs(pid)))putImg(k,v,false);
  gcImages();resetFilters();curPage=null;mkFilter='';editChart=null;Object.keys(GF).forEach(k=>delete GF[k]);
  await DB.set('meta:last',pid);applyUI();resetHistory();flagSave(DB.ok);
  if(upgradeDirectorioLayout()){save();setTimeout(()=>toast('Ficha reorganizada: un solo nombre, Metros cuadrados y Revisión técnica al final'),300)}
  let v='base';try{const s=localStorage.getItem('fichero:view');if(s&&VIEWS.some(x=>x.id===s))v=s}catch(e){}
  showView(v)}

// ---------- pantalla de proyectos ----------
async function renderHome(){const el=$('#view-home');const l=(await listProjects()).sort((a,b)=>String(b.modificado).localeCompare(String(a.modificado)));
  const fd=d=>{try{return new Date(d).toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'})}catch(e){return ''}};
  el.innerHTML=`<div class="home-head"><div><h2>Tus proyectos</h2><p>Cada proyecto tiene su propia base, sus campos, sus gráficas y su catálogo. Se guardan en este navegador.</p></div><span class="sp"></span>
      <button class="btn" data-act="import-json">Abrir archivo (.json)</button><button class="btn primary" data-act="new">Proyecto nuevo</button></div>
    <div class="pgrid">${l.map(p=>`<article class="pcard" data-pid="${p.id}"><span class="stripe"></span><h3 data-open-p>${esc(p.nombre)}</h3>${p.descripcion?`<p>${esc(p.descripcion)}</p>`:''}
        <div class="meta"><span>${p.n||0} registros</span><span>Modificado ${fd(p.modificado)}</span></div>
        <div class="acts"><button class="btn sm primary" data-open-p>Abrir</button><button class="btn sm" data-dup-p>Duplicar</button><button class="btn sm" data-exp-p>Descargar</button><button class="btn sm ghost danger" data-del-p>Eliminar</button></div></article>`).join('')}
      <button class="pcard new" data-act="new"><b>＋ Proyecto nuevo</b><span class="count">Desde una plantilla, en blanco o desde un CSV de Excel</span></button></div>
    ${l.length?'':`<p class="hint" style="margin-top:16px">¿Tienes un respaldo .json de esta app o del Directorio de agencias anterior? Ábrelo con “Abrir archivo”.</p>`}`}
function initHomeEvents(){
  document.addEventListener('click',async e=>{const t=e.target;
    const act=t.closest('[data-act]');if(act&&(act.closest('#view-home')||act.closest('#menuPop'))){e.stopPropagation();return runAction(act.dataset.act)}
    const card=t.closest('#view-home .pcard[data-pid]');if(!card)return;const pid=card.dataset.pid;
    if(t.closest('[data-open-p]'))return openProject(pid);
    if(t.closest('[data-del-p]')){const n=card.querySelector('h3').textContent;if(!await askYes(`¿Eliminar el proyecto “${n}” de este navegador? Esto no se puede deshacer. Descarga antes un respaldo si lo quieres conservar.`,'Eliminar',true))return;
      await deleteProject(pid);renderHome();toast('Proyecto eliminado');return}
    if(t.closest('[data-dup-p]')||t.closest('[data-exp-p]')){const d=await DB.get('p:'+pid);const imgs=await projectImgs(pid);
      if(t.closest('[data-exp-p]')){download(`${fileName(d.P.nombre)}_${today()}.json`,JSON.stringify({app:'fichero',tipo:'proyecto',formato:APP.formato,version:APP.version,fecha:new Date().toISOString(),proyecto:d.P,esquema:d.S,registros:d.R,ajustes:d.ST,imgs}),'application/json');return}
      const c=structuredClone(d);c.P={...c.P,id:'p-'+uid(),nombre:c.P.nombre+' (copia)',creado:new Date().toISOString()};await storeProject(c,imgs);renderHome();toast('Proyecto duplicado')}})}
let newTpl='blank';
function openNewProject(){openId=null;newTpl=newTpl||'blank';
  $('#drawerRoot').innerHTML=`<div class="scrim" data-close></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="npTitle" style="width:min(720px,calc(100% - 32px))">
   <div class="dr-head"><div style="flex:1"><h2 id="npTitle">Proyecto nuevo</h2><p>Elige un punto de partida. Todo (campos, listas, catálogo) se puede cambiar después.</p></div><button class="btn sm" data-close>Cancelar</button></div>
   <div class="dr-body">
     <div class="fld" style="margin:8px 0 14px"><label for="npName">Nombre del proyecto</label><input id="npName" placeholder="Ej. Directorio de sucursales 2026"></div>
     <div class="tplgrid">${TEMPLATES.map(t=>`<button class="tpl" data-tpl="${t.id}" aria-pressed="${newTpl===t.id}"><b>${esc(t.nombre)}</b><span>${esc(t.desc)}</span></button>`).join('')}
       <button class="tpl" data-tpl="_csv" aria-pressed="${newTpl==='_csv'}"><b>Desde un CSV</b><span>Sube una tabla exportada de Excel; cada columna se vuelve un campo.</span></button></div>
     <div class="imgacts" style="margin-top:16px"><button class="btn primary" data-np-go>Crear proyecto</button><span class="sp"></span><button class="btn ghost" data-act2="import-json">O abre un archivo .json</button></div>
   </div></div>`;setTimeout(()=>$('#npName')?.focus(),0)}
function initNewProjectEvents(){$('#drawerRoot').addEventListener('click',async e=>{const t=e.target;
  const tp=t.closest('[data-tpl]');if(tp){newTpl=tp.dataset.tpl;$$('[data-tpl]').forEach(b=>b.setAttribute('aria-pressed',b===tp));return}
  if(t.closest('[data-act2="import-json"]')){closeOverlay(true);$('#jsonInput').click();return}
  if(t.closest('[data-np-go]')){const name=$('#npName').value.trim()||(newTpl==='_csv'?'':(TEMPLATES.find(x=>x.id===newTpl)?.nombre||'Proyecto nuevo'));
    if(newTpl==='_csv'){closeOverlay(true);csvMode='new';pendingCSVName=name;$('#csvInput').click();return}
    const o=TEMPLATES.find(x=>x.id===newTpl).build(name);await storeProject(o,{});closeOverlay(true);await openProject(o.P.id);
    try{localStorage.setItem('fichero:view','base')}catch(e){}showView('base');toast('Proyecto creado. Ajusta los campos en la pestaña Campos.')}})}
let pendingCSVName='';

// ---------- arranque ----------
async function boot(){buildShell();await DB.open();
  VIEWS.forEach(v=>v.init&&v.init());initDrawerEvents();initOptionsEvents();initImageEvents();initIOEvents();initHomeEvents();initNewProjectEvents();initGeoEvents();
  $('#tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)showView(t.dataset.tab)});
  $('#projBtn').addEventListener('click',()=>goHome());
  $('#undoBtn').addEventListener('click',undo);$('#redoBtn').addEventListener('click',redo);
  $('#menuBtn').addEventListener('click',e=>{e.stopPropagation();const p=$('#menuPop');p.classList.toggle('hidden');$('#menuBtn').setAttribute('aria-expanded',!p.classList.contains('hidden'))});
  document.addEventListener('click',e=>{if(!e.target.closest('.menu'))$('#menuPop').classList.add('hidden')});
  document.addEventListener('keydown',e=>{if(!P||!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();const a=document.activeElement;
    if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&!['checkbox','range','color'].includes(a.type))))return;
    if(k==='z'&&!e.shiftKey){e.preventDefault();undo()}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo()}});
  window.addEventListener('beforeunload',e=>{if(saveT){flushSave();e.preventDefault();e.returnValue=''}});
  if(!DB.ok)toast('Este navegador no deja guardar datos aquí. Trabaja y descarga el proyecto antes de cerrar.');
  const last=await DB.get('meta:last');if(last&&await DB.get('p:'+last))await openProject(last);else showView('home')}
boot();

</script>
