<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Solicitudes de Pago</title>
<style>
:root{--bg:#eef0f4;--card:#fff;--tx:#1f2937;--mut:#6b7280;--bd:#d1d5db;--ac:#1d4ed8;--hd:#111827;--sub:#f9fafb}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px}header b{font-size:15px}header span{opacity:.6;font-size:12px}.sp{flex:1}
header button{background:#ffffff1a;color:#fff;border:1px solid #ffffff40}main{flex:1;display:flex;min-height:0}
#f{width:480px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px #0002}
h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:8px}h3 i{background:var(--ac);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-style:normal;font-size:11px}
.fl{margin-top:8px}label{display:block;margin-bottom:3px;font-size:11px;font-weight:600;color:var(--mut)}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:var(--card);color:var(--tx)}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.cot{margin-top:10px;padding:8px 10px;background:var(--sub);border:1px solid var(--bd);border-radius:8px}
.cks{display:flex;flex-wrap:wrap;gap:4px 12px}.cks label{display:flex;gap:4px;align-items:center;font-weight:400;font-size:12px;color:var(--tx);margin:0}.cks input{width:auto}
table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:2px 3px;font-size:11px;color:var(--mut)}.hint{font-size:11px;color:var(--mut);margin:6px 0 0}
button{padding:7px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;margin:4px 4px 0 0}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#pvw{flex:1;display:flex;flex-direction:column;min-width:0}#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}#bar button{margin:0;white-space:nowrap}#bar{flex-wrap:wrap}
#pend{display:none;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;font-size:12px}#st{display:none;color:#92400e;font-size:12px;padding:6px 14px;background:#fff7ed}#pv{flex:1;border:0;background:#525659}
[hidden]{display:none!important}#md,#xm,#dm{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:30}
.mb{background:var(--card);border-radius:12px;width:min(760px,94vw);height:min(640px,90vh);display:flex;flex-direction:column;overflow:hidden}.mh,.mf{padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.mt{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--bd)}.mt .tb{border:0;border-bottom:3px solid transparent;border-radius:0;background:none}.mt .on{border-color:var(--ac);font-weight:700}.mc{flex:1;overflow:auto;padding:4px 16px 12px}
#nb{position:fixed;right:18px;bottom:18px;width:48px;height:48px;border-radius:50%;font-size:22px;padding:0;background:var(--ac);z-index:20;box-shadow:0 3px 10px #0004}
#np{position:fixed;right:18px;bottom:76px;width:310px;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;z-index:20;box-shadow:0 6px 20px #0005}
#np .nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}#np textarea{height:64px}.ni{display:flex;gap:6px;align-items:flex-start;padding:5px 0;border-bottom:1px solid var(--bd);font-size:12px}.ni input{width:auto;margin-top:3px}.ni span{flex:1}.ni small{color:var(--mut)}.ni b{cursor:pointer;color:var(--mut)}.dn span{text-decoration:line-through;opacity:.55}
#bar .on{background:var(--ac);color:#fff}#sh{flex:1;overflow:auto;background:#525659;padding:14px 0}#shp{width:612px;margin:0 auto}
.pg{width:612px;min-height:792px;background:#fff;color:var(--pvv,#000);margin:0 auto 16px;padding:30px 36px;font:12px Arial,Helvetica,sans-serif}.pg *{box-sizing:border-box}
.si{border:0;border-bottom:1px dashed #94a3b8;background:#fffbe6;color:var(--pvv,#000);font:inherit;padding:0 2px;field-sizing:content;min-width:30px;border-radius:0;width:auto}.si:focus{outline:2px solid #2563eb;background:#fff}
.si[readonly]{background:transparent;border-bottom-color:transparent}.si.ta{color:var(--pva)}.si.b{font-weight:700}.si.n{text-align:right}.si.c{text-align:center}.si.up{text-transform:uppercase}.si.sm{width:46px;min-width:46px}
textarea.si{width:100%;field-sizing:fixed;resize:vertical;display:block}.tf{color:var(--pvf)}.ta{color:var(--pva)}
.pg table{border-collapse:collapse;width:100%}.pg td,.pg th{border:1px solid #000;padding:3px 4px;text-align:center;font-size:11px}.pg td:first-child{white-space:nowrap}
.bx{border:1px solid #000;padding:3px 5px;margin:2px 0 14px}.ov{position:relative;display:inline-block}.ov input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.agh{display:flex;gap:14px;margin:18px 0}.agh img{width:96px;height:96px}.ban{background:var(--bn);text-align:center;font-weight:700;padding:6px}.ban select{width:100%;text-align:center}.x{cursor:pointer;color:#b91c1c;margin-left:6px}
input.bad,select.bad,textarea.bad{border-color:#f59e0b!important;background:#f59e0b22!important}input.ok,select.ok,textarea.ok{border-color:#16a34a!important;background:#16a34a22!important}
.si.ok{background:#dcfce7!important}.si.bad{background:#fee2e2!important}.ov.ok>span{background:#dcfce7}.ov.bad>span{background:#fee2e2}button:disabled{opacity:.4;cursor:not-allowed}#lg input{width:26px;height:22px;padding:0;border:0;background:none}#lg label{display:flex;gap:3px;align-items:center;margin:0;color:inherit}

.pe{min-height:110px;border:1px solid var(--bd);border-radius:6px;padding:8px;line-height:2.1;background:var(--card);color:var(--tx);outline:none;white-space:pre-wrap}.pe:focus{outline:2px solid var(--ac)}
.pill{display:inline-block;color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;font-weight:600;margin:0 2px;user-select:none}button.pill{border:0;cursor:pointer;padding:3px 12px;margin:6px 4px 0 0}
.pg{position:relative;overflow:hidden}.wm{position:absolute;left:50%;top:50%;pointer-events:none;white-space:nowrap;font:700 90px Arial;z-index:0;user-select:none}.pg>*:not(.wm){position:relative;z-index:1}
.xg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}.xc{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;text-align:left;margin:0;padding:9px 10px;border-radius:8px}.xc:hover{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}.xc b{color:#fff;font-size:10px;padding:2px 6px;border-radius:4px;min-width:40px;text-align:center}.xc span{font-weight:600}.xc small{flex-basis:100%;color:var(--mut);font-size:11px}.xc.xl{box-shadow:0 0 0 2px #16a34a inset}
.dctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--bd)}.dctl label{display:flex;gap:6px;align-items:center;margin:0;font-size:12px;color:var(--tx)}.dctl input{width:auto}.dctl input[type=color]{width:34px;height:26px;padding:0}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding-top:12px}.dc{display:flex;flex-direction:column;gap:4px;margin:0;padding:8px;border-radius:10px;text-align:left}.dc img{width:100%;aspect-ratio:612/792;background:#f3f4f6;border:1px solid var(--bd);border-radius:4px;display:block}.dc span{font-weight:600;font-size:12px}.dc small{color:var(--mut);font-size:11px}.dc:hover{box-shadow:0 0 0 2px var(--ac) inset}.dc.on{box-shadow:0 0 0 3px #16a34a inset}
.pmt{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:8px;font-size:12px;color:var(--mut)}.pmt label{display:flex;gap:4px;align-items:center;margin:0;font-size:12px;color:var(--tx);font-weight:600}.pmt input{width:auto}.pmt small{color:var(--mut);font-weight:400}#rt .rauto{font-size:11px;color:var(--tx);white-space:nowrap;padding:0 6px}
</style></head><body><header><b>Solicitud de Pago</b><span>Grupo CGE · captura y exporta en el formato oficial</span><div class=sp></div><button id=nw>＋ Nueva solicitud</button><button id=cfgb>⚙ Configuración</button><button id=ex>Exportar datos</button><button id=im>Importar datos</button><input type=file id=fi hidden accept=.json></header><main><aside id="f"></aside><div id=pvw><div id=bar><button id=tS class=on>Hoja editable</button><button id=tP>PDF</button><span style="width:8px"></span><button class=p id=up>Actualizar PDF</button><button id=dl1>Descargar PDF</button><button id=xb>Exportar como… ▾</button><button id=db>🎨 Diseño</button><label style="margin:0 0 0 6px;display:flex;gap:4px;align-items:center"><input type=checkbox id=hl style="width:auto"> Resaltar plantilla</label><span id=lg style="display:flex;gap:8px;font-size:12px;font-weight:600;align-items:center"><label>Fijo <input type=color id=cf></label><label>Automático <input type=color id=ca></label><label>Variable <input type=color id=cv></label></span><span id=miss style="font-size:12px;font-weight:600"></span><span id=pend>Hay cambios sin aplicar</span><span id=mt style="margin-left:auto;font-weight:600"></span></div><div id=st></div><div id=sh><div id=shp></div></div><iframe id="pv" hidden></iframe></div></main>
<button id=nb title="Notas de cambios">📝</button><div id=np hidden><div class=nh><b>📝 Cambios que quiero</b><button id=nx>✕</button></div><textarea id=nt placeholder="Anota un cambio… (Ctrl+Enter agrega)"></textarea><div><button class=p id=na>Agregar</button><button id=nc>Copiar pendientes</button></div><div id=nl></div></div><div id=md hidden></div><div id=xm hidden></div><div id=dm hidden></div>
