<style>
:root{--bg:#eef0f4;--card:#fff;--tx:#1f2937;--mut:#6b7280;--bd:#d1d5db;--ac:#1d4ed8;--hd:#111827;--sub:#f9fafb}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:10px}header b{font-size:15px}header span{opacity:.6;font-size:12px}.sp{flex:1}
header button{background:#ffffff1a;color:#fff;border:1px solid #ffffff40}main{flex:1;display:flex;min-height:0}
#f{width:480px;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border-radius:10px;padding:12px 14px;box-shadow:0 1px 3px #0002}
h3{margin:0 0 4px;font-size:13px;display:flex;align-items:center;gap:8px}h3 i{background:var(--ac);color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-style:normal;font-size:11px}
.fl{margin-top:8px}label{display:block;margin-bottom:3px;font-size:11px;font-weight:600;color:var(--mut)}
input,select,textarea{width:100%;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font:inherit;background:var(--card);color:var(--tx)}input:focus,select:focus,textarea:focus{outline:2px solid var(--ac)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.cot{margin-top:10px;padding:8px 10px;background:var(--sub);border:1px solid var(--bd);border-radius:8px}
.cks{display:flex;flex-wrap:wrap;gap:4px 12px}.cks label{display:flex;gap:4px;align-items:center;font-weight:400;font-size:12px;color:var(--tx);margin:0}.cks input{width:auto}
table{width:100%;border-collapse:collapse;margin-top:8px}td{padding:2px 3px;font-size:11px;color:var(--mut)}.hint{font-size:11px;color:var(--mut);margin:6px 0 0}
button{padding:7px 14px;border-radius:6px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font:inherit;margin:4px 4px 0 0}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#pvw{flex:1;display:flex;flex-direction:column;min-width:0}#bar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}#bar button{margin:0;white-space:nowrap}#bar{flex-wrap:wrap}
#pend{display:none;background:#fef3c7;color:#92400e;padding:3px 10px;border-radius:99px;font-size:12px}#st{display:none;color:#92400e;font-size:12px;padding:6px 14px;background:#fff7ed}#pv{flex:1;border:0;background:#525659}
[hidden]{display:none!important}#md,#xm,#dm{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:30}
.mb{background:var(--card);border-radius:12px;width:min(760px,94vw);height:min(640px,90vh);display:flex;flex-direction:column;overflow:hidden}.mh,.mf{padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.mt{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--bd)}.mt .tb{border:0;border-bottom:3px solid transparent;border-radius:0;background:none}.mt .on{border-color:var(--ac);font-weight:700}.mc{flex:1;overflow:auto;padding:4px 16px 12px}
