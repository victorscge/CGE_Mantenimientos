<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mantenimientos intermedios – Desarrollo de Red</title>
<meta name="theme-color" content="#161B21">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EEF1F4;--panel:#FFFFFF;--panel2:#F4F6F8;--line:#D3DAE1;--text:#1C232B;--muted:#5E6B78;
  --accent:#B9800A;--accent-ink:#1C232B;--accent-soft:#F7E7C2;--ok:#1E8A55;--ok-soft:#D7F0E3;--bad:#C93C3C;--bad-soft:#F8DCDC;--warn:#B9700A;--info:#2F74B5;
  --shadow:0 1px 0 rgba(0,0,0,.04);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#161B21;--panel:#1E252D;--panel2:#26303A;--line:#36424F;--text:#E3E8ED;--muted:#97A4B1;
  --accent:#F0B429;--accent-ink:#1A1A12;--accent-soft:#3A3220;--ok:#4CC38A;--ok-soft:#183A2B;--bad:#F07070;--bad-soft:#41222A;--warn:#F0A23C;--info:#6CB4EE;--shadow:none}}
:root[data-theme="dark"]{
  --bg:#161B21;--panel:#1E252D;--panel2:#26303A;--line:#36424F;--text:#E3E8ED;--muted:#97A4B1;
  --accent:#F0B429;--accent-ink:#1A1A12;--accent-soft:#3A3220;--ok:#4CC38A;--ok-soft:#183A2B;--bad:#F07070;--bad-soft:#41222A;--warn:#F0A23C;--info:#6CB4EE;--shadow:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:600;margin:0;letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--info)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;padding:12px 20px;max-width:1500px;margin:0 auto;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand h1{font-size:26px;line-height:1}
.brand span{color:var(--muted);font-size:13px}
.stripe{height:4px;background:repeating-linear-gradient(135deg,var(--accent) 0 12px,transparent 12px 24px);opacity:.9}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:600}
nav button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
nav button:hover:not([aria-current]){color:var(--text);background:var(--panel2)}
.sync{font-size:12.5px;white-space:nowrap}
#banner{max-width:1500px;margin:12px auto 0;padding:10px 16px;border-radius:10px;border:1px solid var(--line);font-size:14px;display:flex;gap:12px;align-items:flex-start}
#banner.warn{background:var(--accent-soft);border-color:var(--accent)}#banner.bad{background:var(--bad-soft);border-color:var(--bad)}
body.ro #polBox :is(input,select,button),body.ro #obsAdd,body.ro #obsTxt,body.ro #delS,body.ro #toNew,body.ro .cat-table :is(input,select,button),body.ro #cAdd,body.ro #cImp,body.ro #cStd,body.ro #iJ,body.ro #iX,body.ro #iC,body.ro .teamcfg :is(input,select),body.ro [data-cfg]{pointer-events:none;opacity:.45}
.icon-btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
main{max-width:1500px;margin:0 auto;padding:18px 20px 60px}
.view{display:none}.view.on{display:block}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:3px 9px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.gridc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:16px}
/* filtros */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters input[type=search]{min-width:240px;flex:1}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px;max-width:100%}
textarea{width:100%;min-height:76px;resize:vertical}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.count{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer;background:var(--panel)}
.count b{font-weight:600}
.count[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
/* tabla */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
th{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;color:var(--muted);background:var(--panel2);position:sticky;top:0;cursor:pointer;white-space:nowrap;user-select:none}
th.sorted{color:var(--text)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;white-space:nowrap}
td.nowrap{white-space:nowrap}
.folio{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px}
.sub{display:block;color:var(--muted);font-size:12.5px}
.desc{min-width:260px;max-width:420px}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:12px;margin:2px 3px 0 0;background:var(--panel2)}
.neg{color:var(--ok)}.pos{color:var(--bad)}
.timer{font-size:13px;white-space:nowrap}
.timer.late{color:var(--bad);font-weight:600}.timer.soon{color:var(--warn);font-weight:600}.timer.done{color:var(--muted)}
.alert-dot{display:inline-block;min-width:22px;text-align:center;border-radius:999px;font-size:12px;font-weight:700;padding:1px 6px}
.sev-alta{background:var(--bad-soft);color:var(--bad)}.sev-media{background:var(--accent-soft);color:var(--warn)}.sev-baja{background:var(--panel2);color:var(--muted)}
/* formulario */
.form{display:grid;gap:18px}
.fs{border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;background:var(--panel)}
.fs h3{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.fs h3 small{font-family:Barlow,sans-serif;font-weight:400;font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.f label .req{color:var(--accent)}
.f input,.f select,.f textarea{width:100%;border-width:1px 1px 1px 4px}
.f input[type=checkbox]{width:auto;border-width:1px;accent-color:var(--accent)}
.f.ok input,.f.ok select,.f.ok textarea,.f.ok .chipbox{border-left-color:var(--ok)}
.f.bad input,.f.bad select,.f.bad textarea,.f.bad .chipbox{border-left-color:var(--bad)}
.f .msg{font-size:12px;color:var(--bad);min-height:0}
.f.ok .msg{color:var(--ok)}
.ro{background:transparent;border:1px dashed var(--line);border-radius:6px;padding:7px 9px;min-height:36px}
.derived{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);padding:2px 0}
.derived b{color:var(--text);font-weight:500}
.chipbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center;border:1px solid var(--line);border-left-width:4px;border-radius:6px;padding:5px 6px;background:var(--panel2);min-height:38px}
.chipbox .chip{font-size:13px;padding:3px 6px 3px 10px;background:var(--panel)}
.chipbox .chip button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0 3px;font-size:14px;line-height:1}
.chipbox .chip.locked{border-style:dashed}
.chipbox select{border:0;background:transparent;padding:3px;min-width:170px;flex:1}
.savebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:12px;align-items:center;justify-content:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.savebar .state{margin-right:auto;font-size:14px}
.savebar .state.bad{color:var(--bad)}.savebar .state.ok{color:var(--ok)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:6px 11px;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
/* drawer */
.drawer{position:fixed;inset:0;z-index:40;display:none}
.drawer.on{display:block}
.drawer .shade{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.drawer .sheet{position:absolute;top:0;right:0;bottom:0;width:min(960px,100%);background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);border-left:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet-head h2{font-size:28px}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.timeline li{position:relative;padding:0 0 10px 12px;font-size:14px}
.timeline li::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.alerts{display:grid;gap:6px}
.alertrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--panel);font-size:14px}
.alertrow .grow{flex:1}
/* modal y toast */
.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:16px}
.modal.on{display:flex}
.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(460px,100%)}
.modal h3{font-size:22px;margin-bottom:8px}
.modal .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:70;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* reportes */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:16px}
.kpi{background:var(--panel);padding:12px 14px}
.kpi b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:600;line-height:1.1}
.kpi span{color:var(--muted);font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 12px;cursor:pointer}
.subtabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);max-height:640px}
.g-row{display:flex;border-bottom:1px solid var(--line);min-height:30px}
.g-lab{position:sticky;left:0;z-index:2;background:var(--panel);width:250px;min-width:250px;padding:5px 10px;font-size:13px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-track{position:relative;flex:none}
.g-bar{position:absolute;top:7px;height:16px;border-radius:4px;font-size:11px;line-height:16px;padding:0 5px;white-space:nowrap;overflow:hidden;color:#141414;cursor:pointer}
.g-bar.tent{background:transparent!important;border:1.5px dashed var(--muted);color:var(--muted)}
.g-head{position:sticky;top:0;z-index:3;background:var(--panel2)}
.g-head .g-lab{background:var(--panel2);font-weight:600}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:6px 0 0 4px;white-space:nowrap}
.g-today{position:absolute;top:0;bottom:0;border-left:2px solid var(--bad);z-index:1}
.g-late{position:absolute;top:13px;height:4px;background:var(--bad);border-radius:2px}
.wk-tabs{display:flex;gap:6px;margin:10px 0}
.okcell{color:var(--ok);font-weight:600}.badcell{color:var(--bad);font-weight:600}
details summary{cursor:pointer}
.cat-table input,.cat-table select{width:100%;min-width:110px;padding:5px 7px}
.cat-table td{padding:4px 6px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:18px;text-align:center;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.note{font-size:13.5px;color:var(--muted);max-width:80ch}
nav button[draggable]{cursor:grab}nav button.dragging{opacity:.4}nav button.drop-on{box-shadow:inset 0 -3px 0 var(--accent)}
body.compact th,body.compact td{padding:4px 8px}body.compact .fs{padding:10px 12px 12px}
.io-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:16px}
.io-num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:15px;font-family:Barlow,sans-serif;font-weight:600}
.io-list{margin:8px 0 14px;padding-left:20px;color:var(--muted);font-size:14px}.io-list li{margin:3px 0}.io-list b{color:var(--text);font-weight:500}
.io-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.io-btn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
.io-btn:hover{border-color:var(--accent)}.io-btn b{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600}.io-btn span{font-size:12.5px;color:var(--muted)}
.filters label{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
@media (max-width:560px){.io-btns{grid-template-columns:1fr}}

:root{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
select option,select optgroup{background-color:var(--panel);color:var(--text)}
.chipbox select{background:var(--panel2);color:var(--text);border-radius:4px}
.kpi[draggable]{cursor:grab}.kpi.dragging{opacity:.4}.kpi.drop-on{box-shadow:inset 4px 0 0 var(--accent)}.kpi .sub{display:block;font-size:12px;color:var(--muted)}
.perbar{margin-bottom:14px;gap:10px}.perbar .note{max-width:none;flex:1 1 320px}
.gridc.dash{grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));align-items:start}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut svg{width:220px;max-width:100%}
.cbox svg{max-height:var(--ch,280px)}.sz-s{--ch:200px}.sz-m{--ch:280px}.sz-l{--ch:400px;grid-column:1/-1}.cbox .donut svg{width:auto;height:var(--ch);max-width:100%}
.card-head{gap:6px;margin-bottom:6px;flex-wrap:wrap;justify-content:flex-start}.card-head h3{flex:1 1 100%;font-size:18px;min-width:0}.card-head select{padding:3px 6px;font-size:13px}
.io-grid{align-items:stretch}.io-grid>.fs,.other-grid>.fs{display:flex;flex-direction:column}.io-grid .io-btns{margin-top:auto}.io-desc{max-width:none!important}
.other-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px;align-items:stretch}.other-grid>.fs>.row:last-child{margin-top:auto!important;padding-top:12px}
.kpis{background:transparent;border:0;gap:8px;overflow:visible}.kpis .kpi{border:1px solid var(--line);border-radius:10px}.kpis[data-kpiboard="dash"]{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.kpi b{overflow-wrap:anywhere}
.cfg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:16px;align-items:start}.colchecks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
@media (max-width:720px){.bar{padding:10px 12px}main{padding:12px}.brand h1{font-size:22px}.g-lab{width:150px;min-width:150px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand"><h1>Mantenimientos intermedios</h1><span id="subTit">Desarrollo de Red</span></div>
    <nav id="nav" aria-label="Pestañas"></nav>
    <span class="sync muted" id="syncChip"></span>
    <button class="icon-btn" id="themeBtn" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">◐</button>
  </div>
  <div class="stripe" aria-hidden="true"></div>
</header>
<div id="banner" style="display:none"></div>
<main>
  <section class="view on" id="v-seg"></section>
  <section class="view" id="v-nueva"></section>
  <section class="view" id="v-datos"></section>
  <section class="view" id="v-rep"></section>
  <section class="view" id="v-io"></section>
  <section class="view" id="v-dash"></section>
  <section class="view" id="v-cfg"></section>
</main>
<div id="loader" style="position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:var(--bg)"><div style="text-align:center"><div class="stripe" style="width:220px;margin:0 auto 14px"></div><h2 style="font-size:24px">Conectando con la base del equipo…</h2><p class="muted">Cargando solicitudes y catálogos</p></div></div>
<div class="drawer" id="drawer"><div class="shade" data-close></div><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

const LOWER=new Set(['de','del','la','las','los','y','e','en','el','da','van','von']);
function fixText(s){
  s=String(s??'').replace(/\s+/g,' ').trim();
  if(!s)return s;
  s=s.replace(/[A-Za-zÁÉÍÓÚáéíóúÑñÜü]+/g,w=>{const t=TYPO[w.toLowerCase()];if(!t)return w;return w[0]===w[0].toUpperCase()&&w[0]!==w[0].toLowerCase()?t[0].toUpperCase()+t.slice(1):t});
  if(s===s.toUpperCase()&&s.length>6)s=s.toLowerCase();
  s=s.replace(/\s+([,.;:])/g,'$1').replace(/[ .]+$/,'');
  return s[0].toUpperCase()+s.slice(1);
}
function fixName(s){
  s=String(s??'').replace(/\s+/g,' ').trim();if(!s)return s;
  const fixes={'victor rodriguez':'Víctor Rodríguez','natalaia borrego':'Natalia Borrego','raul flores':'Raúl Flores','rául flores':'Raúl Flores'};
  if(fixes[strip(s)])return fixes[strip(s)];
  return s.split(' ').map((w,i)=>i>0&&LOWER.has(w.toLowerCase())?w.toLowerCase():(w.length<=3&&w===w.toUpperCase()&&/[A-Z]/.test(w)?w:w[0].toUpperCase()+w.slice(1).toLowerCase())).join(' ');
}

function timer(s){
  const g=estGroup(s.estado);

  const fe=fechaEstCalc(s);
  if(!s.inicio){const d=diffDays(s.fechaSol,todayStr());return {txt:'Obra sin iniciar',cls:'done'}}

  const d=diffDays(s.inicio,todayStr()),tot=fe?diffDays(s.inicio,fe):null,rest=fe?diffDays(todayStr(),fe):null;

function alertsOf(s){
  const A=[],g=estGroup(s.estado),fe=fechaEstCalc(s),t=todayStr();
  const add=(sev,msg,fix)=>A.push({sev,msg,fix});
  (s.avisos||[]).forEach((m,i)=>add('alta','Conciliación: '+m,{aviso:i,label:'Marcar como revisado'}));
  if(fe&&s.fechaSol&&fe<s.fechaSol)add('alta',`Fecha estimada (${fmtD(fe)}) anterior a la solicitud (${fmtD(s.fechaSol)})`);
  if(s.inicio&&s.fechaSol&&s.inicio<s.fechaSol)add('alta',`Inicio (${fmtD(s.inicio)}) anterior a la solicitud`);
  if(s.fechaReal&&s.inicio&&s.fechaReal<s.inicio)add('alta',`Fecha real anterior al inicio`);
  if(s.fechaReal&&s.fechaReal>t)add('alta','Fecha real en el futuro');
  const dup=DB.solicitudes.filter(x=>x.folio===s.folio).length;if(dup>1)add('alta',`Folio ${s.folio} repetido en ${dup} solicitudes`);
  if(g==='concluida'&&!s.fechaReal)add('media','Concluida sin fecha real'+(s.sugReal?` · sugerida ${fmtD(s.sugReal)} (reporte en que pasó a Concluida)`:''),s.sugReal?{campo:'fechaReal',valor:s.sugReal,label:'Usar '+fmtD(s.sugReal)}:null);
  if(g!=='cancelada'&&offRank(s.estado)>=5&&!s.inicio)add('baja','Sin fecha de inicio'+(s.sugInicio?` · sugerida ${fmtD(s.sugInicio)} (último reporte antes de verla en ejecución)`:''),s.sugInicio?{campo:'inicio',valor:s.sugInicio,label:'Usar '+fmtD(s.sugInicio)}:null);
  if(g==='proceso'&&fe&&fe<t)add('media',`Plazo vencido el ${fmtD(fe)}`);
  if(g==='proceso'&&!fe)add('baja','Sin fecha estimada de conclusión');
  if(g==='proceso'&&s.fechaReal)add('media','Tiene fecha real pero sigue en proceso');

  if(s.estimado&&s.contratado&&s.contratado>s.estimado*(+CFG().sobrecosto||150)/100)add('baja',`Contratado ${Math.round(s.contratado/s.estimado*100)}% del estimado`);
  if(g==='concluida'&&!s.contratado)add('media','Concluida sin monto contratado');
  polAlerts(s,add);
  return A;
}

/* ================= POLÍTICAS DE CONTRATACIÓN (vigentes desde 03/08/2026) ================= */
const CFG_DEF={vigencia:'2026-08-03',estIVA:'sin',conIVA:'con',bloqueo:true,topeDirecta:40000,topeComparativa:150000,topeOT:999000,topeActa:250000,topeCatalogo:250000,anticipoBase:30,anticipoMax:50,extrasMax:30,retencion:5,garantiaOTdias:90,garantiaContratoPct:7,garantiaContratoDias:120,penaDia:0.5,penaTope:10,pagoDias:7,fraccDias:30,semIniDia:1,semIniHora:'09:00',semFinDia:6,semFinHora:'14:00',mesIniHora:'09:00',mesCierreLV:'19:30',mesCierreSab:'14:00',porVencer:3,sobrecosto:150,topeOTmin:50000};
const CFG=()=>DB.cfg;
const PROC={directa:'Contratación directa',comparativa:'Contratación comparativa',invitacion:'Invitación a cuando menos tres'};
const PROC_RANK={directa:0,comparativa:1,invitacion:2};
const FORMAL={correo:'Correo de adjudicación',ot:'Orden de trabajo',contrato:'Contrato (Jurídica)'};
const DOC_OK=['Completa','Exento de REPSE'];
const AUTORIZA=['Director General','Subdirector','Director de Proyectos','Gerente de Obras y Mantenimiento'];
const sinIVA=(v,campo)=>v==null||v===''||isNaN(v)?null:(CFG()[campo]==='con'?v/1.16:+v);
const procOf=v=>{const c=CFG();if(v==null)return null;return v<=c.topeDirecta?'directa':v<=c.topeComparativa?'comparativa':'invitacion'};
function pol(s){if(!s.pol)s.pol={};const p=s.pol;p.cots=p.cots||[];p.docs=p.docs||{};p.extras=p.extras||[];p.pagos=p.pagos||[];return p}
function polInfo(s){
  const c=CFG(),p=pol(s),est=sinIVA(s.estimado,'estIVA'),con=sinIVA(s.contratado,'conIVA');
  const base=est??con, mx=Math.max(est||0,con||0)||null;
  const proc=procOf(base),procCon=procOf(con);
  const formal=!proc?null:(mx>c.topeOT?'contrato':mx>c.topeOTmin?'ot':'correo');
  const cotReq=proc==='directa'?1:proc==='comparativa'?2:3;
  const aplica=(s.fechaSol||'')>=c.vigencia;
  const extrasTot=p.extras.reduce((a,x)=>a+(+x.monto||0),0);
  const extrasPct=s.contratado?extrasTot/s.contratado*100:null;
  const fr=s.fechaReal;let garVence=null,garDias=null;
  if(p.garTipo&&p.garTipo!=='No se pactó'&&fr){garDias=mx>c.topeOT?c.garantiaContratoDias:c.garantiaOTdias;garVence=addDays(fr,garDias+1)}
  return {est,con,base,mx,proc,procCon,formal,cotReq,aplica,extrasTot,extrasPct,garVence,garDias,p};
}
function reqs(s){
  const c=CFG(),I=polInfo(s),p=I.p,R=[];const add=(k,label,ok,etapa,extra={})=>R.push({k,label,ok:!!ok,etapa,...extra});
  if(!I.proc)return R;
  add('presupuesto','Presupuesto estimado determinado (num. 3 h)',s.estimado>0,'formalizar');
  const cum=p.cots.filter(x=>x.cumple!==false&&+x.monto>0);
  if(p.unico)add('excep','Asignación a contratista único autorizada por DG, Subdirector o Director de Proyectos (num. 4 d)',['Director General','Subdirector','Director de Proyectos'].includes(p.excepAut),'formalizar');
  else if(p.urgente&&I.proc==='directa')add('excep','Trabajo urgente autorizado por el Gerente de Obras y Mantenimiento (num. 4 d)',!!p.excepAut,'formalizar');
  else{
    const ok=I.proc==='invitacion'?(cum.length>=3||(cum.length>=2&&p.evid3)):cum.length>=I.cotReq;
    add('cots',`Cotizaciones que cumplen: ${cum.length} de ${I.cotReq}${I.proc==='invitacion'?' (o 2 con evidencia de gestión de la tercera)':''} (num. 4)`,ok,'formalizar',{dato:true});
    if(cum.length){const min=Math.min(...cum.map(x=>+x.monto)),adj=p.cots.find(x=>x.adj);
      add('adj','Adjudicada a la oferta más baja que cumple (num. 4 b y c)',adj&&adj.cumple!==false&&+adj.monto===min,'formalizar',{dato:true})}
  }
  if(I.proc!=='directa'&&!p.unico)add('solCot','Solicitud de cotización enviada (Anexo 3)',p.docs.solCot,'formalizar');
  if(I.formal==='correo')add('correoAdj','Correo de adjudicación al contratista (num. 4 a)',p.docs.correoAdj,'formalizar');
  if(I.formal==='ot')add('ot','Orden de trabajo firmada con folio CGE-OT (Anexo 2)',p.docs.ot&&/^CGE-OT-\d{4}$/.test(s.ot||''),'formalizar');
  if(I.formal==='contrato')add('contrato','Contrato elaborado y validado por la Dirección Jurídica (num. 4 c y 10)',p.docs.contrato&&p.docs.juridica,'formalizar');
  const pv=proveedor(s.contratista);
  if(s.forma!=='Interno')add('docCont',`Documentación del contratista: CSF, estado de cuenta, identificación, acta y poder; REPSE si aplica (Anexo 3, punto 5)${pv?' · '+(pv.estadoDoc||'sin registro'):''}`,pv&&DOC_OK.includes(pv.estadoDoc),'formalizar',{dato:true});
  if(I.mx>c.topeCatalogo||p.construccion)add('catalogo','Catálogo de conceptos (num. 7)',p.docs.catalogo,'formalizar');
  if(p.construccion){add('proyecto','Proyecto arquitectónico y, en su caso, ingenierías y cálculo estructural (num. 7)',p.docs.proyecto,'formalizar');add('residente','Residente de obra asignado (num. 7)',!!(p.residente||'').trim(),'formalizar',{dato:true})}
  if((+p.antPct||0)>c.anticipoBase)add('anticipo',`Anticipo de ${p.antPct} %: solicitado en la cotización y con visto bueno del Gerente (num. 6)`,p.antVoBo&&p.antEnCot&&p.antPct<=c.anticipoMax,'formalizar',{dato:true});
  if(I.mx>c.topeActa)add('actaER','Acta de entrega-recepción con finiquito (Anexo 4, num. 9)',p.docs.actaER,'cierre');
  else{add('formatoRec','Formato de recepción y aceptación de los trabajos (num. 9)',p.docs.formatoRec,'cierre');add('aceptUsuaria','Aceptación del área usuaria (num. 9)',p.docs.aceptUsuaria,'cierre')}
  if(I.mx>c.topeOT)add('garantia',`Garantía por vicios ocultos: cheque de caja por ${c.garantiaContratoPct} % durante ${c.garantiaContratoDias} días (num. 8)`,/cheque/i.test(p.garTipo||''),'cierre',{dato:true});
  else if(I.formal==='ot')add('garantia',`Garantía por vicios ocultos: retención ${c.retencion} % o cheque, ${c.garantiaOTdias} días (num. 8; opcional en la política, obligatoria en la OT)`,!!p.garTipo&&p.garTipo!=='No se pactó','cierre',{dato:true,opcional:true});
  if(p.extras.length)add('extras',`Extraordinarios dentro del ${c.extrasMax} % del monto contratado (num. 11)`,I.extrasPct!=null&&I.extrasPct<=c.extrasMax,'cierre',{dato:true});
  return R;
}
function gateMissing(s,target){
  const I=polInfo(s);if(!I.aplica||!I.proc)return [];
  const r=offRank(target),g=estGroup(target);
  const R=reqs(s).filter(x=>!x.ok&&!x.opcional);
  return R.filter(x=>(x.etapa==='formalizar'&&r>=4&&g!=='cancelada')||(x.etapa==='cierre'&&g==='concluida'));
}
function expedientePct(s){const R=reqs(s).filter(x=>!x.opcional);if(!R.length)return null;return Math.round(R.filter(x=>x.ok).length/R.length*100)}
function penaRetraso(s){
  const c=CFG(),I=polInfo(s);if(!['ot','contrato'].includes(I.formal)||!s.contratado)return null;
  const fe=fechaEstCalc(s);if(!fe)return null;const fin=s.fechaReal||(isActive(s)?todayStr():null);if(!fin||fin<=fe)return null;
  const dias=diffDays(fe,fin),pct=Math.min(dias*c.penaDia,c.penaTope);return {dias,pct,monto:s.contratado*pct/100};
}
function polAlerts(s,add){
  const c=CFG(),I=polInfo(s),p=I.p,g=estGroup(s.estado),t=todayStr();
  if(!I.aplica||g==='cancelada'||!I.proc)return;
  const R=offRank(s.estado);
  if(I.procCon&&PROC_RANK[I.procCon]>PROC_RANK[I.proc])add('media',`Política: el presupuesto la clasifica como ${PROC[I.proc].toLowerCase()}, pero lo contratado (${money(I.con)} antes de IVA) corresponde a ${PROC[I.procCon].toLowerCase()}. La política se rige por el presupuesto; documenta la justificación o las cotizaciones del rango mayor`);
  const miss=reqs(s).filter(x=>!x.ok&&!x.opcional&&((x.etapa==='formalizar'&&R>=4)||(x.etapa==='cierre'&&g==='concluida')));
  if(miss.length)add(g==='concluida'?'baja':'media',`Expediente: faltan ${miss.length} requisito${miss.length>1?'s':''} de la política (${miss.map(x=>x.label.split(' (')[0]).join('; ')})`);
  const cum=p.cots.filter(x=>x.cumple!==false&&+x.monto>0),adj=p.cots.find(x=>x.adj);
  if(adj&&cum.length&&+adj.monto>Math.min(...cum.map(x=>+x.monto)))add('alta','Política: la cotización adjudicada no es la más baja de las que cumplen (num. 4)');
  if(adj&&adj.proveedor&&s.contratista&&adj.proveedor!==s.contratista)add('media',`La cotización adjudicada es de «${adj.proveedor}» pero el contratista registrado es «${s.contratista}»`);
  if(+p.antPct>c.anticipoMax)add('alta',`Anticipo de ${p.antPct} %: la política permite máximo ${c.anticipoMax} % (num. 6)`);
  else if(+p.antPct>c.anticipoBase&&!(p.antVoBo&&p.antEnCot))add('media',`Anticipo de ${p.antPct} % sin visto bueno del Gerente o sin estar en la cotización (num. 6)`);
  if(I.extrasPct!=null&&I.extrasPct>c.extrasMax)add('alta',`Extraordinarios por ${Math.round(I.extrasPct)} % del monto contratado: la política permite máximo ${c.extrasMax} % (num. 11)`);
  const pv=proveedor(s.contratista);
  if(R>=4&&s.forma!=='Interno'&&s.contratista&&!(pv&&DOC_OK.includes(pv.estadoDoc)))add('media',`Contratista «${s.contratista}» con documentación ${pv&&pv.estadoDoc?'«'+pv.estadoDoc+'»':'sin registrar'} (REPSE / expediente)`);
  const pen=penaRetraso(s);if(pen)add('media',`Retraso de ${pen.dias} d: pena convencional estimada ${pen.pct.toFixed(1)} % = ${money(pen.monto)} (OT cláusula 14 a, ${c.penaDia} % diario, tope ${c.penaTope} %). Verifica si el retraso es imputable al contratista`);
  p.pagos.forEach(x=>{if(x.fechaFactura&&!x.fechaPago){const d=diffDays(x.fechaFactura,t);if(d>c.pagoDias)add('media',`Pago de ${x.tipo||'estimación'} pendiente desde hace ${d} días (plazo de ${c.pagoDias} días naturales, Anexo 3)`)}
    if(x.tipo==='Finiquito'&&!reqs(s).filter(r=>r.etapa==='cierre'&&!r.opcional).every(r=>r.ok))add('media','Finiquito registrado sin acta o formato de recepción completos (num. 12)')});
  if(I.garVence){const d=diffDays(t,I.garVence);if(d<0)add('baja',`Garantía vencida el ${fmtD(I.garVence)}: si no hubo vicios, libera la retención o el cheque`);else if(d<=15)add('baja',`Garantía vence en ${d} días (${fmtD(I.garVence)})`)}
  // tope y fraccionamiento (la política no lo regula: alerta preventiva)
  if(I.base!=null&&I.base>c.topeDirecta*0.95&&I.base<=c.topeDirecta)add('baja',`Monto a menos del 5 % del tope de contratación directa (${money(c.topeDirecta)} antes de IVA)`);
  const tope=I.proc==='directa'?c.topeDirecta:I.proc==='comparativa'?c.topeComparativa:null;
  if(tope){const near=DB.solicitudes.filter(o=>o!==s&&o.agencia===s.agencia&&estGroup(o.estado)!=='cancelada'&&Math.abs(diffDays(o.fechaSol,s.fechaSol)||999)<=c.fraccDias&&polInfo(o).proc===I.proc);
    const sum=near.reduce((a,o)=>a+(polInfo(o).base||0),I.base||0);
    if(near.length&&sum>tope)add('media',`Posible fraccionamiento: con ${near.map(o=>'folio '+o.folio).join(', ')} (misma agencia, ${c.fraccDias} días) suman ${money(sum)} antes de IVA, arriba del tope de ${PROC[I.proc].toLowerCase()}. La política no lo regula; documenta que son alcances distintos`);
    const twin=DB.solicitudes.find(o=>o!==s&&o.agencia===s.agencia&&s.contratado&&o.contratado===s.contratado);
    if(twin)add('baja',`Mismo monto contratado que el folio ${twin.folio} de la misma agencia: confirma que no es duplicado`)}
}

function bindPolPanel(box,src,onChange){
  const p=pol(src);const done=(msg)=>{save();onChange&&onChange();if(msg)toast(msg)};
  box.onchange=e=>{const t=e.target;
    if(t.dataset.pf){p[t.dataset.pf]=t.checked;if(t.dataset.pf==='unico'&&t.checked)p.urgente=false;return done()}
    if(t.dataset.pv){p[t.dataset.pv]=t.type==='number'?(t.value===''?null:+t.value):t.value;return done()}
    if(t.dataset.pdoc){p.docs[t.dataset.pdoc]=t.checked;(src.obs=src.obs||[]).push({fecha:new Date().toISOString(),texto:`Expediente: ${t.parentElement.textContent.trim()} ${t.checked?'entregado':'desmarcado'}`});return done()}
    const set=(arr,i,k)=>{const x=arr[+i];if(k==='adj'){p.cots.forEach(c=>c.adj=false);x.adj=true;if(x.proveedor&&!src.contratista)src.contratista=x.proveedor}else if(k==='cumple')x.cumple=t.checked;else x[k]=t.type==='number'?(t.value===''?null:+t.value):t.value};
    if(t.dataset.cot!=null){set(p.cots,t.dataset.cot,t.dataset.k);return done()}
    if(t.dataset.ext!=null){set(p.extras,t.dataset.ext,t.dataset.k);return done()}
    if(t.dataset.pag!=null){set(p.pagos,t.dataset.pag,t.dataset.k);return done()}
  };
  box.onclick=async e=>{const t=e.target;
    if(t.id==='cotAdd'){p.cots.push({proveedor:'',monto:null,fecha:todayStr(),cumple:true,adj:false});return done()}
    if(t.id==='extAdd'){p.extras.push({fecha:todayStr(),desc:'',monto:null,autorizo:''});return done()}
    if(t.id==='pagAdd'){p.pagos.push({tipo:p.pagos.length?'Estimación':'Anticipo',monto:null,fechaFactura:'',fechaPago:''});return done()}
    for(const [attr,arr] of [['cotdel',p.cots],['extdel',p.extras],['pagdel',p.pagos]])if(t.dataset[attr]!=null){if(await confirmBox('Eliminar renglón','Se quitará este renglón.','Eliminar',true)){arr.splice(+t.dataset[attr],1);done()}return}
  };
}

/* ================= NUBE (base compartida del equipo) ================= */
const CLOUD={on:false,db:null,user:null,uid:null,readonly:false,canAdmin:false,first:false,pending:new Set(),dirtyRemote:false};
const SYNC={sol:new Map(),cat:null,cfg:null,snap:null};
const solKey=s=>{const o={...s,modPor:undefined,modEn:undefined};const p=o.pol;if(p&&!(p.cots||[]).length&&!(p.extras||[]).length&&!(p.pagos||[]).length&&!Object.keys(p.docs||{}).length&&Object.keys(p).every(k=>['cots','extras','pagos','docs'].includes(k)))o.pol=undefined;return JSON.stringify(o)};
function setChip(state,extra){const c=$('#syncChip');if(!c)return;const M={local:['Guardado en este navegador','muted'],conn:[CLOUD.backend==='sheets'?'Conectando con Google Sheets…':'Conectando con la nube…','muted'],ok:[CLOUD.backend==='sheets'?'En Google Sheets · compartida con tu equipo':'En la nube · compartida con tu equipo','okcell'],saving:['Guardando…','muted'],ro:['Solo lectura','badcell'],err:[CLOUD.backend==='sheets'?'Sin conexión con Google Sheets':'Sin conexión con la nube','badcell']};const [t,cl]=M[state]||M.local;c.textContent=(state==='ok'||state==='saving'?'☁ ':'')+t+(extra?' · '+extra:'');c.className='sync '+cl}
// límite de escrituras simultáneas
let ACTIVE=0;const WAIT=[];let MAXW=4;
function slot(){return new Promise(r=>{if(ACTIVE<MAXW){ACTIVE++;r()}else WAIT.push(r)})}
function release(){ACTIVE--;const n=WAIT.shift();if(n){ACTIVE++;n()}if(!ACTIVE&&!WAIT.length&&!CLOUD.readonly)setChip('ok')}
const CHAIN=new Map();
function writeDoc(path,fn,id){
  if(id)CLOUD.pending.add(id);setChip('saving');
  const run=async()=>{await slot();try{
      try{await fn()}catch(e){
        if(e&&(e.code==='unavailable'||e.code==='resource_exhausted')){await new Promise(r=>setTimeout(r,800+Math.random()*1500));await fn()}else throw e}
    }catch(e){writeError(e)}finally{release();if(id)CLOUD.pending.delete(id)}};
  const p=(CHAIN.get(path)||Promise.resolve()).then(run,run);CHAIN.set(path,p);return p;
}
function writeError(e){
  const code=e&&e.code;
  if(code==='invalid_argument'){if(!CLOUD.readonly){CLOUD.readonly=true;setChip('ro');setBanner();toast('No tienes permiso para modificar esta base: se muestra en solo lectura');revertFromSync();render()}return}
  if(code==='quota_exceeded'){toast('La base en la nube llegó a su límite de espacio; exporta un respaldo y depura registros');return}
  if(code==='revoked'){CLOUD.readonly=true;setChip('ro');return}
  setChip('err');toast('No se pudo guardar en la nube; revisa tu conexión e inténtalo de nuevo');
}
function revertFromSync(){
  DB.solicitudes=[...SYNC.sol.values()].map(k=>JSON.parse(k));
  if(SYNC.cat)DB.cat=JSON.parse(SYNC.cat);if(SYNC.cfg)DB.cfg=Object.assign({},CFG_DEF,JSON.parse(SYNC.cfg));
}
function stamp(s){(s.hist||[]).forEach(h=>{if(!h.por&&h.fecha&&h.fecha.length>10&&h.origen!=='reporte')h.por=CLOUD.uid});(s.obs||[]).forEach(o=>{if(!o.por&&o.fecha&&o.fecha.length>10)o.por=CLOUD.uid})}
function cloudSync(){
  if(CLOUD.readonly){toast('Solo lectura: los cambios no se guardaron');revertFromSync();render();return}
  const db=CLOUD.db,now=new Date().toISOString(),ids=new Set();
  DB.solicitudes.forEach(s=>{
    if(!s.id)s.id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    ids.add(s.id);const before=SYNC.sol.get(s.id);if(before&&before===solKey(s))return;
    stamp(s);s.modPor=CLOUD.uid;s.modEn=now;const k=solKey(s);SYNC.sol.set(s.id,k);const body=JSON.parse(JSON.stringify(s));
    writeDoc('solicitudes/'+s.id,()=>db.doc('solicitudes/'+s.id).set(body),s.id);
  });

const gasTransport=req=>new Promise((res,rej)=>window.google.script.run

const fetchTransport=(url,key)=>async req=>{

function makeSheetsDb(transport,who){
  const cache={solicitudes:new Map(),config:new Map()},revs=new Map(),listeners=[],ops=new Map();
  let rev=0,loaded=false,inFlight=null,flushT=null,pollT=null,failNote=false;
  const snap=col=>{const docs=[...cache[col].entries()].map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
  const notify=()=>listeners.forEach(l=>{try{l.cb(snap(l.col))}catch(e){console.error(e)}});
  const call=async req=>{const r=await transport({...req,user:who()});if(!r||!r.ok)throw {code:(r&&r.code)||'unavailable',message:(r&&r.message)||'Error'};return r};
  async function pull(){
    const r=await call({action:'pull',since:rev});let ch=!loaded;
    const apply=(col,list)=>list.forEach(x=>{const p=col+'/'+x.id;if(ops.has(p))return;if((revs.get(p)||0)>=x.rev)return;revs.set(p,x.rev);ch=true;
      if(x.deleted)cache[col].delete(x.id);else{try{cache[col].set(x.id,JSON.parse(x.data))}catch(e){console.warn('JSON dañado en',p)}}});
    apply('solicitudes',r.sol||[]);apply('config',r.cfg||[]);rev=Math.max(rev,r.rev||0);loaded=true;if(ch)notify();
  }
  function schedulePoll(ms){clearTimeout(pollT);pollT=setTimeout(async()=>{if(document.visibilityState==='visible'&&!inFlight&&!ops.size){try{await pull();if(failNote){failNote=false;setChip('ok')}}catch(e){if(e.code==='invalid_argument'){listeners.forEach(l=>l.err&&l.err(e));return}setChip('err')}}schedulePoll(15000)},ms)}
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&loaded)schedulePoll(300)});
  function queue(path,op){
    const [col,id]=path.split('/');
    if(op.op==='set')cache[col].set(id,op.body);else cache[col].delete(id);
    return new Promise((resolve,reject)=>{const prev=ops.get(path);const waiters=prev?prev.waiters.concat([{resolve,reject}]):[{resolve,reject}];ops.set(path,{...op,col,id,waiters});clearTimeout(flushT);flushT=setTimeout(flush,350)});
  }
  async function flush(){
    if(inFlight){clearTimeout(flushT);flushT=setTimeout(flush,400);return}
    if(!ops.size)return;
    const batch=new Map(ops);const req={action:'push',sol:[],del:[],cfg:[],cfgDel:[]};
    batch.forEach((o,p)=>{const b=revs.get(p);const it={id:o.id,data:JSON.stringify(o.body),baseRev:b??null};if(o.col==='solicitudes'){if(o.op==='set')req.sol.push(it);else req.del.push(o.id)}else{if(o.op==='set')req.cfg.push(it);else req.cfgDel.push(o.id)}});
    let delay=3000;
    for(;;){
      try{inFlight=call(req);const r=await inFlight;inFlight=null;
        Object.entries(r.applied||{}).forEach(([id,v])=>{['solicitudes','config'].forEach(c=>{if(batch.has(c+'/'+id))revs.set(c+'/'+id,v)})});
        batch.forEach((o,p)=>{if(ops.get(p)===o)ops.delete(p);o.waiters.forEach(w=>w.resolve())});
        if((r.conflicts||[]).length)toast('Alguien más había cambiado '+r.conflicts.length+' registro(s) al mismo tiempo; se guardó tu versión');
        failNote=false;
        try{await pull()}catch(e){}
        if(ops.size){clearTimeout(flushT);flushT=setTimeout(flush,200)}
        return;
      }catch(e){inFlight=null;
        if(e.code==='invalid_argument'||e.code==='quota_exceeded'){batch.forEach((o,p)=>{if(ops.get(p)===o)ops.delete(p);o.waiters.forEach(w=>w.reject(e))});return}
        if(!failNote){failNote=true;setChip('err');toast('Sin conexión con Google Sheets; se reintentará guardar automáticamente')}
        await new Promise(r=>setTimeout(r,delay));delay=Math.min(delay*2,60000);
      }
    }
  }
  return {
    collection:col=>({onSnapshot:(cb,err)=>{listeners.push({col,cb,err});
      if(loaded)setTimeout(()=>cb(snap(col)),0);
      else if(listeners.length===1)pull().then(()=>schedulePoll(15000)).catch(e=>{listeners.forEach(l=>l.err&&l.err(e))});
      return()=>{}}}),
    doc:path=>({set:body=>queue(path,{op:'set',body:JSON.parse(JSON.stringify(body))}),delete:()=>queue(path,{op:'del'})}),
  };
}

function supaErr(e){
  if(!e)return {code:'unavailable',message:'Sin respuesta'};
  const c=String(e.code||''),m=String(e.message||e);
  if(c==='42501'||/row-level security|permission denied/i.test(m))return {code:'invalid_argument',message:'Sin permiso para guardar'};
  if(c==='54000'||/quota|limit exceeded/i.test(m))return {code:'quota_exceeded',message:m};
  if(c==='PGRST301'||/JWT|expired/i.test(m))return {code:'unavailable',message:'La sesión expiró; vuelve a entrar'};
  return {code:'unavailable',message:m};
}
function makeSupaDb(sb){
  const cache={solicitudes:new Map(),config:new Map()},listeners=[],loaded={},channels={};
  const snap=col=>{const docs=[...cache[col].entries()].map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}));return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}};
  const notify=col=>listeners.filter(l=>l.col===col).forEach(l=>{try{l.cb(snap(col))}catch(e){console.error(e)}});
  async function fetchAll(col){
    const out=new Map();let from=0;const step=1000;
    for(;;){const {data,error}=await sb.from(col).select('id,data').order('id').range(from,from+step-1);if(error)throw supaErr(error);
      data.forEach(r=>out.set(r.id,r.data));if(data.length<step)break;from+=step}
    const changed=!loaded[col]||out.size!==cache[col].size||[...out].some(([k,v])=>JSON.stringify(cache[col].get(k))!==JSON.stringify(v));
    cache[col]=out;loaded[col]=true;if(changed)notify(col);
  }
  function subscribe(col){
    if(channels[col])return;
    channels[col]=sb.channel('rt-'+col).on('postgres_changes',{event:'*',schema:'public',table:col},p=>{
      if(p.eventType==='DELETE'){const id=(p.old||{}).id;if(id!=null&&cache[col].delete(id))notify(col);return}
      const r=p.new||{};if(r.id==null)return;
      if(r.data===undefined){fetchAll(col).catch(()=>{});return}
      if(JSON.stringify(cache[col].get(r.id))===JSON.stringify(r.data))return;
      cache[col].set(r.id,r.data);notify(col);
    }).subscribe();
  }
  // Respaldo por si se corta el tiempo real: revisa cada 60 s y al volver a la pestaña
  let pollT=null;const poll=()=>{clearTimeout(pollT);pollT=setTimeout(async()=>{if(document.visibilityState==='visible'){for(const c of Object.keys(loaded)){try{await fetchAll(c)}catch(e){}}}poll()},60000)};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')Object.keys(loaded).forEach(c=>fetchAll(c).catch(()=>{}))});
  return {
    collection:col=>({onSnapshot:(cb,err)=>{listeners.push({col,cb,err});
      if(loaded[col])setTimeout(()=>cb(snap(col)),0);
      else fetchAll(col).then(()=>{subscribe(col);poll()}).catch(e=>{listeners.filter(l=>l.col===col).forEach(l=>l.err&&l.err(e))});
      return()=>{}}}),
    doc:path=>{const [col,id]=path.split('/');return {
      set:async body=>{cache[col].set(id,body);const {error}=await sb.from(col).upsert({id,data:body});if(error)throw supaErr(error)},
      delete:async()=>{cache[col].delete(id);const {error}=await sb.from(col).delete().eq('id',id);if(error)throw supaErr(error)}}},
  };
}

const F={q:'',estado:'',agencia:'',resp:'',tipo:'',grupo:'proceso',alertas:false,sort:'folio',dir:1};
function filtered(){
  const q=strip(F.q);
  return DB.solicitudes.filter(s=>{
    if(F.grupo&&estGroup(s.estado)!==F.grupo)return false;
    if(F.estado&&s.estado!==F.estado)return false;
    if(F.agencia&&s.agencia!==F.agencia)return false;
    if(F.resp&&s.responsable!==F.resp)return false;
    if(F.tipo&&(agencia(s.agencia)||{}).tipo!==F.tipo)return false;
    if(F.alertas&&!alertsOf(s).some(a=>a.sev!=='baja'))return false;
    if(q){const hay=strip([s.folio,s.descripcion,s.agencia,s.solicitante,s.responsable,s.contratista,s.estado,(s.actividades||[]).map(a=>a.nombre).join(' ')].join(' '));if(!q.split(/\s+/).every(w=>hay.includes(w)))return false}
    return true;
  });
}
const COLS=[['folio','Folio'],['agencia','Agencia'],['descripcion','Descripción'],['fechaSol','Solicitud'],['responsable','Responsable'],['estado','Estado'],['estimado','Estimado','num'],['contratado','Contratado','num'],['dif','Diferencia','num'],['inicio','Inicio'],['fechaEst','Fecha est.'],['fechaReal','Real'],['timer','Avance'],['al','⚠']];
function sortVal(s,k){if(k==='folio'){const [n,x]=folioNum(s.folio);return n*100+(x?1:0)}if(k==='dif')return (s.contratado||0)-(s.estimado||0);if(k==='estado')return estRank(s.estado);if(k==='fechaEst')return fechaEstCalc(s)||'';if(k==='al'){const w=worst(alertsOf(s));return w==null?9:sevRank[w]}if(k==='timer')return s.inicio||'9';const v=s[k];return v==null?'':(typeof v==='string'?strip(v):v)}
function renderSeg(){

    <select id="fa">${opts(ags,F.agencia,'Todas las agencias')}</select>
    <select id="ft">${opts(TIPOS,F.tipo,'Todos los tipos')}</select>
    <select id="fr">${opts(cat('responsables').map(r=>r.nombre),F.resp,'Todos los responsables')}</select>

  [['fe','estado'],['fa','agencia'],['ft','tipo'],['fr','resp']].forEach(([id,k])=>$('#'+id).onchange=e=>{F[k]=e.target.value;drawTable()});

function drawTable(){
  const rows=filtered().sort((a,b)=>{const x=sortVal(a,F.sort),y=sortVal(b,F.sort);return (x>y?1:x<y?-1:0)*F.dir});
  const tot=rows.reduce((t,s)=>(t.e+=s.estimado||0,t.c+=s.contratado||0,t),{e:0,c:0});
  const V=COLS.filter(c=>c[0]==='folio'||!((PREFS.colsHidden||[]).includes(c[0])));
  const cell=(k,s)=>{const a=agencia(s.agencia)||{},dif=(s.contratado!=null&&s.estimado!=null)?s.contratado-s.estimado:null;
    switch(k){case 'folio':return `<td class="folio">${esc(s.folio)}</td>`;
    case 'agencia':return `<td class="nowrap">${esc(s.agencia)}<span class="sub">${esc(a.tipo||'')} · ${esc(a.ciudad||'')}</span></td>`;
    case 'descripcion':return `<td class="desc">${esc(s.descripcion)}<span style="display:block;margin-top:3px">${(s.actividades||[]).map(x=>`<span class="chip">${esc(x.nombre)}</span>`).join('')}</span></td>`;
    case 'fechaSol':return `<td class="nowrap">${fmtD(s.fechaSol)}<span class="sub">${esc(s.solicitante||'—')}</span></td>`;
    case 'responsable':return `<td>${esc(s.responsable||'—')}</td>`;
    case 'estado':return `<td>${pill(s.estado)}${s.motivo?`<span class="sub">${esc(s.motivo)}</span>`:''}</td>`;
    case 'estimado':return `<td class="num">${money(s.estimado)}</td>`;case 'contratado':return `<td class="num">${money(s.contratado)}</td>`;
    case 'dif':return `<td class="num ${dif>0?'pos':dif<0?'neg':''}">${dif==null?'':money(dif)}</td>`;
    case 'inicio':return `<td class="nowrap">${s.inicio?fmtD(s.inicio):'<span class="muted">Pendiente</span>'}</td>`;
    case 'fechaEst':return `<td class="nowrap">${fmtD(fechaEstCalc(s))}</td>`;case 'fechaReal':return `<td class="nowrap">${fmtD(s.fechaReal)}</td>`;
    case 'timer':{const t=timer(s);return `<td><span class="timer ${t.cls}">Obra: ${esc(t.txt)}</span><span class="sub">Solicitud: ${solTimerHTML(s)}</span></td>`}
    case 'al':{const A=alertsOf(s),w=worst(A);return `<td>${w?`<span class="alert-dot sev-${w}" title="${esc(A.map(x=>x.msg).join('\n'))}">${A.length}</span>`:''}</td>`}}return '<td></td>'};
  const foot=V.map((c,i)=>i===0?`<td class="muted nowrap">${rows.length} solicitudes</td>`:c[0]==='estimado'?`<td class="num">${money(tot.e)}</td>`:c[0]==='contratado'?`<td class="num">${money(tot.c)}</td>`:c[0]==='dif'?`<td class="num">${money(tot.c-tot.e)}</td>`:'<td></td>').join('');
  $('#segTable').innerHTML=rows.length?`<div class="tablewrap"><table><thead><tr>${V.map(([k,l,c])=>`<th class="${c||''} ${F.sort===k?'sorted':''}" data-k="${k}">${l}${F.sort===k?(F.dir>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(s=>`<tr data-id="${s.id}">${V.map(c=>cell(c[0],s)).join('')}</tr>`).join('')}
  </tbody><tfoot><tr>${foot}</tr></tfoot></table></div>`
  :`<div class="panel"><p>No hay solicitudes con estos filtros.</p><button class="btn" id="clrF">Quitar filtros</button></div>`;
  $$('#segTable th').forEach(th=>th.onclick=()=>{const k=th.dataset.k;F.dir=F.sort===k?-F.dir:1;F.sort=k;drawTable()});
  $$('#segTable tbody tr').forEach(tr=>tr.onclick=()=>openDrawer(tr.dataset.id));
  const c=$('#clrF');if(c)c.onclick=()=>{Object.assign(F,{q:'',estado:'',agencia:'',resp:'',tipo:'',grupo:'',alertas:false});renderSeg()};
}

function blank(){return {id:null,folio:nextFolio(),solicitante:'',cargo:'',fechaSol:todayStr(),horaSol:nowTime(),fechaManual:false,alta:null,agencia:'',descripcion:'',actividades:[],responsable:'',forma:'Externo',estimado:null,contratado:null,estado:'Recibida',motivo:'',inicio:null,plazo:'2',fechaEst:null,fechaReal:null,contratista:'',ot:'',obs:[],hist:[]}}
function validate(s){
  const E={},R=offRank(s.estado),g=estGroup(s.estado),t=todayStr();
  const req=(k,cond,msg)=>{if(cond)E[k]=msg};
  req('solicitante',!s.solicitante,'Elige o escribe quién solicita');
  req('cargo',!s.cargo,'Indica el cargo');
  req('agencia',!agencia(s.agencia),'Elige una agencia del catálogo');
  req('descripcion',!s.descripcion||s.descripcion.length<10,'Describe el trabajo (mínimo 10 caracteres)');
  req('actividades',!(s.actividades||[]).length,'Agrega al menos una actividad');
  req('responsable',!s.responsable,'Asigna un responsable');
  req('estado',!estDef(s.estado),'Elige un estado');
  if(s.fechaSol>t)E.fechaSol='La fecha de solicitud no puede ser futura';
  if(R>=2&&!(s.estimado>0))E.estimado='Desde «Elaboración de propuesta» se requiere el estimado';
  if(R>=4&&g!=='cancelada'&&!(s.contratado>0))E.contratado='Desde «Anticipo o liquidación» se requiere el monto';
  if(s.forma==='Externo'&&R>=4&&g!=='cancelada'&&!s.contratista)E.contratista='Elige el contratista';
  if(R>=5&&g!=='cancelada'&&!s.inicio)E.inicio='En ejecución se requiere fecha de inicio';
  if(s.inicio&&s.inicio<s.fechaSol)E.inicio='El inicio no puede ser anterior a la solicitud';
  const fe=fechaEstCalc(s);
  if(s.plazo==='custom'&&s.inicio&&!s.fechaEst&&g==='proceso')E.fechaEst='Elige la fecha estimada';
  if(R>=4&&g==='proceso'&&!fe)E.fechaEst='Al contratar el servicio indica la fecha estimada de conclusión';
  if(fe&&s.inicio&&fe<s.inicio)E.fechaEst='La fecha estimada no puede ser anterior al inicio';
  if(g==='concluida'&&!s.fechaReal)E.fechaReal='Para concluir se requiere la fecha real';
  if(s.fechaReal&&s.fechaReal>t)E.fechaReal='La fecha real no puede ser futura';
  if(s.fechaReal&&s.inicio&&s.fechaReal<s.inicio)E.fechaReal='La fecha real no puede ser anterior al inicio';
  if(needsMotivo(s.estado)&&!s.motivo)E.motivo='Indica el motivo';
  if(s.ot&&!/^CGE-OT-\d{4}$/.test(s.ot))E.ot='Formato CGE-OT-0000';
  return E;
}

    if(n==='horaInicio'){s.horaInicio=t.value?t.value+':00':null;return paint()}

  });
  fr.addEventListener('click',async e=>{
    const fb=e.target.closest('[data-forma]');if(fb){s.forma=fb.dataset.forma;return rerender()}

let repTab='resumen',repCorte=null,repSheet='En proceso',ganttMode='activas';
function stateAt(s,corte){const H=(s.hist||[]).filter(h=>h.fecha&&h.fecha.slice(0,10)<=corte);return H.length?H[H.length-1].estado:((s.hist||[])[0]||{}).estado||s.estado}
function prevState(s,corte){const all=(s.hist||[]).filter(h=>h.fecha&&h.fecha.slice(0,10)<=corte);const last=all[all.length-1];if(last&&last.previo)return last.previo;const H=all.filter(h=>estGroup(h.estado)!=='cancelada');return H.length?H[H.length-1].estado:'Recibida'}
function weeklyRows(corte){
  const out={'En proceso':[],'Concluidos':[],'Cancelados':[]};
  DB.solicitudes.forEach(s=>{
    const alta=(s.alta||s.fechaSol||'').slice(0,10);if(!alta||alta>corte)return;
    const e=stateAt(s,corte),g=estGroup(e);
    const sheet=g==='concluida'?'Concluidos':g==='cancelada'?'Cancelados':'En proceso';
    const label=g==='cancelada'?repLabel(prevState(s,corte)):repLabel(e);
    const dif=sheet==='Cancelados'?((e==='No procede'?'NO PROCEDE: ':'')+(s.motivo||'CANCELADO')).toUpperCase():((s.contratado!=null||s.estimado!=null)?(s.contratado||0)-(s.estimado||0):null);
    out[sheet].push({folio:s.folio,nombre:s.solicitante,cargo:s.cargo,fecha:s.fechaSol,desc:s.descripcion,agencia:s.agencia,estado:label,est:s.estimado,con:sheet==='Cancelados'?0:s.contratado,dif,fest:fechaEstCalc(s),freal:(s.fechaReal&&s.fechaReal<=corte&&sheet==='Concluidos')?s.fechaReal:null,id:s.id});
  });
  Object.values(out).forEach(a=>a.sort((x,y)=>{const [a1,b1]=folioNum(x.folio),[a2,b2]=folioNum(y.folio);return a1-a2||String(b1).localeCompare(String(b2))}));
  return out;
}
function saturdays(){const out=[];let d=pd('2026-08-01');const end=pd(todayStr());end.setDate(end.getDate()+((6-end.getDay()+7)%7));while(d<=end){out.push(ds(d));d.setDate(d.getDate()+7)}return out.reverse()}
function hbar(data,{fmt=v=>v,w=480}={}){

const wkLabel=w=>`${DIA_C[w.st.getDay()]} ${fmtDT(w.st)} – ${DIA_C[w.en.getDay()]} ${fmtDT(w.en)}`;
function weekEvents(w){
  const E={nuevas:[],cambios:[],concl:[],canc:[],obs:[]};const inW=d=>d&&d>=w.st&&d<=w.en;
  DB.solicitudes.forEach(s=>{

    (s.hist||[]).forEach((h,i)=>{if(i===0)return;const d=evDate(h.fecha);if(!inW(d))return;const ev={s,d,de:h.previo||(s.hist[i-1]||{}).estado||'',a:h.estado,nota:h.nota||''};E.cambios.push(ev);const g=estGroup(h.estado);if(g==='concluida')E.concl.push(ev);else if(g==='cancelada')E.canc.push(ev)});

function monthWindow(y,m){const c=CFG();const d=new Date(y,m,1);while(d.getDay()===0)d.setDate(d.getDate()+1);const st=new Date(d);st.setMinutes(hm(c.mesIniHora));

function vbar(data,fmt){const w=640,h=290,pb=70,pl=62,max=Math.max(...data.map(d=>d.v),0)||1,min=Math.min(0,...data.map(d=>d.v)),rng=max-min||1,cw=(w-pl-10)/data.length,bw=Math.min(42,cw*.7),y=v=>10+(h-pb-10)*(max-v)/rng,rot=data.length>6;
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${gridLines(w,pl,y,min,rng,fmt)}${data.map((d,i)=>{const x=pl+i*cw+cw/2,y0=y(0),y1=y(d.v);return `<rect x="${x-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y0-y1))}" rx="3" style="fill:${d.c}"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></rect><text x="${x}" y="${Math.min(y0,y1)-5}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${esc(short(d.v,fmt))}</text><text transform="translate(${x},${h-pb+14}) rotate(${rot?-35:0})" font-size="11" text-anchor="${rot?'end':'middle'}" style="fill:var(--muted)">${esc(cut(d.l,18))}</text>`}).join('')}</svg>`}
function vbars2(data,{w=640,pdf}={}){
  if(!data.length)return '<p class="muted">Sin datos con estos criterios.</p>';
  const h=pdf?280:250,pb=pdf?64:44,pl=62,max=Math.max(...data.flatMap(m=>[m.e,m.cn]),1),cw=(w-pl-10)/data.length,bw=Math.min(26,cw/2.6),rot=data.length>6,y=v=>h-pb-(h-pb-14)*v/max;

  ${data.map((m,i)=>{const x=pl+i*cw+cw/2;return `<rect x="${x-bw-1}" y="${y(m.e)}" width="${bw}" height="${h-pb-y(m.e)}" style="fill:var(--info)"><title>${esc(m.l)} · Estimado ${money(m.e)}</title></rect><rect x="${x+1}" y="${y(m.cn)}" width="${bw}" height="${h-pb-y(m.cn)}" style="fill:var(--accent)"><title>${esc(m.l)} · Contratado ${money(m.cn)}</title></rect><text transform="translate(${x},${h-pb+15}) rotate(${rot?-35:0})" font-size="11.5" text-anchor="${rot?'end':'middle'}" style="fill:var(--muted)">${esc(cut(m.l,16))}</text>`}).join('')}
  ${pdf?`<rect x="${pl}" y="${h-14}" width="11" height="11" style="fill:var(--info)"/><text x="${pl+16}" y="${h-4}" font-size="11.5" style="fill:var(--muted)">Estimado</text><rect x="${pl+92}" y="${h-14}" width="11" height="11" style="fill:var(--accent)"/><text x="${pl+108}" y="${h-4}" font-size="11.5" style="fill:var(--muted)">Contratado</text>`:''}</svg>

function lineC(data,fmt){const w=640,h=270,pb=44,pl=62,max=Math.max(...data.map(d=>d.v),0)||1,min=Math.min(0,...data.map(d=>d.v)),rng=max-min||1,n=data.length,x=i=>n===1?(pl+w)/2:pl+12+i*(w-pl-30)/(n-1),y=v=>10+(h-pb-10)*(max-v)/rng,step=Math.ceil(n/10);
  return `<svg viewBox="0 0 ${w} ${h}" role="img">${gridLines(w,pl,y,min,rng,fmt)}<polyline points="${data.map((d,i)=>x(i)+','+y(d.v)).join(' ')}" fill="none" style="stroke:var(--accent);stroke-width:2.5"/>${data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d.v)}" r="4" style="fill:var(--accent)"><title>${esc(d.l)}: ${esc(fmt(d.v))}</title></circle>${i%step===0?`<text x="${x(i)}" y="${h-pb+18}" font-size="11" text-anchor="middle" style="fill:var(--muted)">${esc(cut(d.l,12))}</text>`:''}`).join('')}</svg>`}
function donut(data,fmt,pdf){const pos=data.filter(d=>d.v>0),tot=pos.reduce((a,d)=>a+d.v,0);if(!tot)return '<p class="muted">No hay valores positivos para la dona; prueba otro tipo de gráfico.</p>';
  const R=92,r=56,cx=110,cy=110;let a0=-Math.PI/2;const p=(a,rad)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  const arcs=pos.map(d=>{const a1=a0+2*Math.PI*d.v/tot,lg=a1-a0>Math.PI?1:0;let path;
    if(pos.length===1)path=`M${cx-R},${cy}a${R},${R} 0 1,0 ${2*R},0a${R},${R} 0 1,0 ${-2*R},0M${cx-r},${cy}a${r},${r} 0 1,1 ${2*r},0a${r},${r} 0 1,1 ${-2*r},0`;
    else{const [x0,y0]=p(a0,R),[x1,y1]=p(a1,R),[x2,y2]=p(a1,r),[x3,y3]=p(a0,r);path=`M${x0},${y0}A${R},${R} 0 ${lg} 1 ${x1},${y1}L${x2},${y2}A${r},${r} 0 ${lg} 0 ${x3},${y3}Z`}
    a0=a1;return `<path d="${path}" fill-rule="evenodd" style="fill:${d.c};stroke:var(--panel);stroke-width:1.5"><title>${esc(d.l)}: ${esc(fmt(d.v))} (${Math.round(d.v/tot*100)} %)</title></path>`});
  const center=`<text x="${cx}" y="${cy}" text-anchor="middle" font-size="18" font-weight="600" style="fill:var(--text)">${esc(short(tot,fmt))}</text><text x="${cx}" y="${cy+17}" text-anchor="middle" font-size="11" style="fill:var(--muted)">total</text>`;
  if(pdf){const lh=20,H=Math.max(220,pos.length*lh+20);return `<svg viewBox="0 0 640 ${H}" role="img"><g transform="translate(0,${(H-220)/2})">${arcs.join('')}${center}</g>${pos.map((d,i)=>`<rect x="250" y="${14+i*lh}" width="12" height="12" rx="2" style="fill:${d.c}"/><text x="270" y="${24+i*lh}" font-size="12" style="fill:var(--text)">${esc(cut(d.l,34))} · ${esc(fmt(d.v))} (${Math.round(d.v/tot*100)} %)</text>`).join('')}</svg>`}
  return `<div class="donut"><svg viewBox="0 0 220 220">${arcs.join('')}${center}</svg><div class="legend" style="flex-direction:column;gap:5px;flex:1;min-width:190px">${pos.map(d=>`<span><i style="background:${d.c}"></i>${esc(d.l)} · <b style="color:var(--text);font-weight:500">${esc(fmt(d.v))}</b> (${Math.round(d.v/tot*100)} %)</span>`).join('')}</div></div>`}

    <div class="f"><label>Recordarme exportar un respaldo cada</label>${sel('respaldoDias',[[0,'Nunca'],[3,'3 días'],[7,'7 días'],[15,'15 días'],[30,'30 días']],p.respaldoDias)}</div>
   </div></div>
   <div class="fs teamcfg"><h3>Periodos de reporte <small>Compartido</small></h3><div class="fields">
    <div class="f"><label>Semana: empieza el</label>${dia('semIniDia')}</div><div class="f"><label>a las</label>${tm('semIniHora')}</div>
    <div class="f"><label>y termina el</label>${dia('semFinDia')}</div><div class="f"><label>a las</label>${tm('semFinHora')}</div>
    <div class="f"><label>Mes: abre el primer día laboral a las</label>${tm('mesIniHora')}</div>
    <div class="f"><label>Cierre del último día laboral (lun. a vie.)</label>${tm('mesCierreLV')}</div>
    <div class="f"><label>Cierre si el último día laboral es sábado</label>${tm('mesCierreSab')}</div>
   </div><p class="note" style="margin-top:8px">Semana actual: ${esc(semDesc())}. Lo capturado fuera del horario semanal no entra en ningún reporte semanal. Días laborales: lunes a sábado.</p></div>
   <div class="fs teamcfg"><h3>Alertas <small>Compartido</small></h3><div class="fields">
    <div class="f"><label>Marcar «por vencer» con</label><select data-wk="porVencer">${[1,2,3,5,7].map(n=>`<option value="${n}" ${+c.porVencer===n?'selected':''}>${n} día${n>1?'s':''} o menos</option>`).join('')}</select></div>
    <div class="f"><label>Alertar sobrecosto cuando lo contratado supera</label><select data-wk="sobrecosto">${[110,120,130,150,200].map(n=>`<option value="${n}" ${+c.sobrecosto===n?'selected':''}>${n} % del estimado</option>`).join('')}</select></div>
   </div><p class="note" style="margin-top:8px">Los montos de la política (incluida la OT obligatoria arriba de ${money(c.topeOTmin)} + IVA) se ajustan en Datos › Política de contratación.</p></div>
  </div>
  <div class="row" style="margin-top:16px"><button class="btn danger" id="prefReset">Restablecer lo de este navegador</button><span class="note">Regresa apariencia, pestañas, columnas y orden de recuadros. No borra datos ni gráficos del dashboard.</span></div>`;
  $$('[data-pref]',el).forEach(i=>i.onchange=()=>{const k=i.dataset.pref;let v=i.value;if(k==='subtitulo')v=v.trim()||'Desarrollo de Red';if(k==='pdfGraf')v=v==='true';if(k==='respaldoDias')v=+v;if(k==='firma')v=v.trim();PREFS[k]=v;if(k==='grupoDef')F.grupo=v;if(k==='perDef')PER.modo=null;savePrefs();applyPrefs();toast('Configuración guardada')});
  $$('[data-col]',el).forEach(cb=>cb.onchange=()=>{const k=cb.dataset.col;PREFS.colsHidden=cb.checked?PREFS.colsHidden.filter(x=>x!==k):[...PREFS.colsHidden,k];savePrefs();toast('Columnas actualizadas')});
  $$('[data-tabvis]',el).forEach(cb=>cb.onchange=()=>{const t=cb.dataset.tabvis;PREFS.ocultas=cb.checked?PREFS.ocultas.filter(x=>x!==t):[...PREFS.ocultas,t];
    if(visibleTabs().length<2){PREFS.ocultas=PREFS.ocultas.filter(x=>x!==t);toast('Deja al menos una pestaña visible además de Configuración')}
    if(PREFS.ocultas.includes(PREFS.inicio))PREFS.inicio=visibleTabs().find(x=>x!=='cfg');savePrefs();renderNav();renderCfg()});
  $$('[data-tabmv]',el).forEach(b=>b.onclick=()=>{const i=+b.dataset.tabmv,j=i+(+b.dataset.d),t=PREFS.tabs;[t[i],t[j]]=[t[j],t[i]];savePrefs();renderNav();renderCfg()});
  $$('[data-wk]',el).forEach(i=>i.onchange=()=>{if(CLOUD.on&&CLOUD.readonly)return;const c=CFG(),k=i.dataset.wk,old=c[k];c[k]=/Dia$|porVencer|sobrecosto/.test(k)?+i.value:i.value;
    if(/^sem/.test(k)&&(c.semFinDia-1)*1440+hm(c.semFinHora)<=(c.semIniDia-1)*1440+hm(c.semIniHora)){c[k]=old;i.value=old;toast('El fin de la semana debe ser después del inicio');return}
    save();toast('Ajuste compartido guardado');renderCfg()});
  $('#prefReset',el).onclick=async()=>{if(await confirmBox('Restablecer','Se regresan apariencia, pestañas, columnas y orden de recuadros a como venían.','Restablecer')){const keep={dash:PREFS.dash,lastExport:PREFS.lastExport};PREFS=Object.assign(clone(PREF_DEF),keep);savePrefs();applyPrefs();renderCfg()}};
}

/* ---------- tema y arranque ---------- */
$('#themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme;const dark=cur==='dark'||(cur==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);PREFS.theme=dark?'light':'dark';savePrefs();applyPrefs();render()};
F.grupo=PREFS.grupoDef;if(visibleTabs().includes(PREFS.inicio)&&PREFS.inicio!=='cfg')current=PREFS.inicio;
applyPrefs();$$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+current));
boot();
setTimeout(()=>{const d=+PREFS.respaldoDias;if(!d||(CLOUD.on&&!CLOUD.backend))return;const last=PREFS.lastExport||0,dias=Math.floor((Date.now()-last)/864e5);if(!last||dias>=d)toast(last?`Llevas ${dias} días sin exportar un respaldo (Importar / exportar)`:'Aún no exportas un respaldo desde este navegador (Importar / exportar)',6000)},2500);

</script>
</body>
</html>
