<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apps Grupo CGE</title>
<style>
:root{--bg:#eef1f6;--card:#fff;--tx:#111827;--mut:#6b7280;--bd:#e5e7eb;--ac:#0b3d91;--ac2:#2563eb;--hd:#0f172a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#24304a;--ac:#60a5fa;--ac2:#3b82f6;--hd:#020617}}
:root[data-theme=dark]{--bg:#0b1220;--card:#131c2e;--tx:#e5e7eb;--mut:#94a3b8;--bd:#24304a;--ac:#60a5fa;--ac2:#3b82f6;--hd:#020617}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
header{background:var(--hd);color:#fff;padding:28px 16px 64px}
.wrap{max-width:1040px;margin:0 auto}
.top{display:flex;align-items:center;gap:16px}
.logo{width:56px;height:56px;border-radius:14px;background:#fff;display:grid;place-items:center;flex:none}
.logo img{width:40px;height:40px;object-fit:contain}
h1{margin:0;font-size:24px;letter-spacing:.2px}
.sub{margin:2px 0 0;opacity:.7;font-size:14px}
.sp{flex:1}
#th{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap;flex:none}
.search{margin-top:22px;position:relative}
.search input{width:100%;padding:13px 16px 13px 42px;border-radius:12px;border:0;font:inherit;background:#fff;color:#111827;box-shadow:0 4px 18px #0004}
.search span{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
main{margin-top:-36px;padding:0 16px 48px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:26px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.app{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative}
a.app:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0f172a1f;border-color:var(--ac2)}
a.app:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
.ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px;color:#fff}
.app b{font-size:16px}
.app p{margin:0;color:var(--mut);font-size:13.5px;flex:1}
.ft{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px}
.tag{padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ac2) 12%,transparent);color:var(--ac);font-weight:600}
.go{color:var(--ac);font-weight:700}
.app.off{opacity:.55;border-style:dashed}
.app.off .go{color:var(--mut);font-weight:600}
.empty{display:none;color:var(--mut);padding:24px 0}
footer{color:var(--mut);font-size:12px;text-align:center;padding:0 16px 28px}
@media (max-width:520px){h1{font-size:20px}header{padding-bottom:56px}}
</style>
</head>

<main class="wrap">
  <h2 id="h-on">Disponibles</h2><div class="grid" id="on"></div>

</main>
<footer>Cada app guarda su información en este navegador, salvo Mantenimientos intermedios, que usa la base de datos del equipo.</footer>
<script>
// Lista de apps: para publicar una nueva, pon su carpeta en "url" y "on:true".
const APPS=[
 {n:'Mantenimientos intermedios',d:'Seguimiento de solicitudes, reportes semanales, Gantt e importación/exportación. Base compartida del equipo.',url:'../',ic:'🛠️',c:'#0b3d91',t:'Obra',on:true},
 {n:'Solicitudes de Pago',d:'Anticipos, estimaciones y finiquitos con comparativa de cotizaciones; exporta PDF y otros formatos.',url:'../solicitudes-de-pago/',ic:'💳',c:'#047857',t:'Pagos',on:true},
 {n:'Cámaras y protección contra incendio',d:'Coloca cámaras, detectores de humo y extintores sobre el plano, revisa coberturas con muros y exporta el reporte en PDF.',url:'../camaras-plano/',ic:'📹',c:'#1d4ed8',t:'Seguridad',on:true},
 {n:'Muebles en Plano',d:'Catálogo de muebles y equipo con fotos y precios: amuebla planos por zonas, presupuesto interno o cotización a cliente y requisición de compras en PDF y Excel.',url:'../muebles-plano/',ic:'🛋️',c:'#9333ea',t:'Obra',on:true},
 {n:'Reporte Fotográfico',d:'Reportes de actividades con fotos por agencia: anotaciones sobre cada foto, 25 formatos y exportación directa a PDF o imágenes.',url:'../reporte-fotografico/',ic:'📷',c:'#7c3aed',t:'Obra',on:true},
 {n:'Viáticos',d:'Solicitud y comprobación de viáticos editando directo sobre la hoja, con totales automáticos y exportación directa a PDF.',url:'../viaticos/',ic:'🧾',c:'#b45309',t:'Administración',on:true},
 {n:'Solicitud de Mobiliario',d:'Formato de mobiliario con imágenes y ligas, en carta vertical u horizontal.',url:'',ic:'🪑',c:'#be123c',t:'Obra',on:false},
 {n:'Directorio de agencias',d:'Base de datos de agencias: planos, equipos, metros y catálogo exportable.',url:'',ic:'🏢',c:'#0e7490',t:'Red',on:false}
];
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const card=a=>{const inner=`<div class="ic" style="background:${a.c}">${a.ic}</div><b>${esc(a.n)}</b><p>${esc(a.d)}</p><div class="ft"><span class="tag">${esc(a.t)}</span><span class="go">${a.on?'Abrir →':'Aún no está en línea'}</span></div>`;
 return a.on?`<a class="app" href="${esc(a.url)}">${inner}</a>`:`<div class="app off" aria-disabled="true">${inner}</div>`};
function draw(){const q=$('q').value.trim().toLowerCase(),f=APPS.filter(a=>!q||(a.n+' '+a.d+' '+a.t).toLowerCase().includes(q)),on=f.filter(a=>a.on),off=f.filter(a=>!a.on);
 $('on').innerHTML=on.map(card).join('');$('off').innerHTML=off.map(card).join('');$('h-on').style.display=on.length?'':'none';$('h-off').style.display=off.length?'':'none';$('none').style.display=f.length?'none':'block'}
$('q').addEventListener('input',draw);
const setTh=t=>{if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme};
try{setTh(localStorage.getItem('cge_menu_tema'))}catch(e){}
$('th').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),n=cur=='dark'?'light':'dark';setTh(n);try{localStorage.setItem('cge_menu_tema',n)}catch(e){}};
draw();
</script>
