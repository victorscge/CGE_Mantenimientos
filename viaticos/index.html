<title>Viáticos · Grupo CGE</title>
<style>
:root{--bg:#eef0f4;--tx:#1f2937;--bd:#d1d5db;--ac:#1d4ed8;--hd:#111827}
*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:13px/1.4 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--hd);color:#fff;padding:8px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}header b{font-size:15px}header img{height:28px;background:#fff;border-radius:50%;padding:2px}.sp{flex:1}
button{padding:6px 12px;border-radius:6px;border:1px solid var(--bd);background:#fff;color:var(--tx);cursor:pointer;font:inherit}
header button{background:#ffffff1a;color:#fff;border-color:#ffffff40}header button.p{background:var(--ac);border-color:var(--ac);font-weight:600}
.lg{display:flex;gap:6px;align-items:center;font-size:11px;color:#e5e7eb}.lg .st,.lg .v,.lg .a{padding:1px 10px;border-radius:10px;color:#111}
.lg label{display:flex;gap:4px;align-items:center;margin-left:4px}
#pv{flex:1;overflow:auto;background:#525659;padding:14px 0}#pages{zoom:.95}
.pg{width:8.5in;height:11in;background:#fff;margin:0 auto 16px;padding:.45in .6in .7in;position:relative;overflow:hidden;font:8.5pt Arial,Helvetica,sans-serif;color:#000}
.col .st,.lg .st{background:#e2e8f0}.col .v,.lg .v{background:#fde68a}.col .a,.lg .a{background:#bbf7d0}
.hd{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}.hd img{height:.7in}.hd .tt{flex:1;line-height:1.35}.hd .tt b{font-size:11pt}.hd .rt{text-align:right}
.id{width:100%;border-collapse:collapse;margin-bottom:6px}.id td{border:1px solid #000;padding:3px 5px}.id td:nth-child(4){white-space:nowrap}.id td:nth-child(2){width:38%}
.sh{background:#111;color:#fff;font-weight:700;padding:2px 6px;margin-top:8px;font-size:8pt;letter-spacing:.04em}
.t{border-collapse:collapse;width:100%}.t td,.t th{border:1px solid #000;padding:2px 4px;text-align:center;font-size:8pt}.t th{background:#e5e7eb}.t th.sh{background:#111;color:#fff;margin:0}.t td.l{text-align:left}.t td.r,p.r{text-align:right}.t td.x{background:#eee}.t td.b{font-weight:700}
.v,.a,.st{border-radius:2px;padding:0 2px}.t .v,.id .v{display:block;min-height:1.35em}.v[contenteditable]:focus,input:focus,select:focus{outline:2px solid #1d4ed8}
.id input.v,.hd input.v{display:inline-block}.v:empty::before{content:attr(data-ph);color:#9ca3af}.pg input,.pg select{border:0;font:inherit;background:transparent;padding:0;color:#000}
.fm{display:flex;justify-content:space-around;margin-top:46px;text-align:center}.fm div{border-top:1px solid #000;width:2.1in;padding-top:2px;font-weight:700}
.pf{position:absolute;left:.6in;right:.6in;bottom:.4in;border-top:1px solid #000;display:flex;justify-content:space-between;padding-top:3px;font-size:7pt}
.np button{padding:0 6px;font-size:10px}.add{margin-top:4px}

const A=id=>`<span class="a" data-a="${id}"></span>`,L=t=>`<b class="st">${t}</b>`,T=t=>`<span class="st">${t}</span>`;
const head=(title,ed)=>`<div class="hd"><img src="${LOGO}"><div class="tt"><div>${T('<b>GRUPO CGE</b>')}</div><div>${T('AUTOMÓVILES HERMT, S.A. DE C.V.')}</div><div>${T(title)}</div></div><div class="rt">${L('Fecha:')} ${ed?dt('fecha'):A('fecha')}</div></div>`;
const ident=ed=>`<table class="id"><tr><td>${L('Nombre:')}</td><td>${ed?f('nombre',{h:'Nombre completo'}):A('nom')}</td><td>${L('Depto:')}</td><td>${ed?f('depto'):A('dep')}</td></tr><tr><td>${L('Motivo:')}</td><td>${ed?f('motivo',{h:'Ej. RENAULT LOS CABOS'}):A('mot')}</td><td>${L('Periodo:')}</td><td>${ed?`${dt('ini')} al ${dt('fin')}`:A('per')} ${A('dur')}</td></tr></table>`;
const foot=(l,k,N)=>`<div class="pf">${T('GRUPO CGE')}${T(l)}${T(`Página ${k} de ${N}`)}</div>`;
const sig=(...a)=>`<div class="fm">${a.map(x=>`<div>${T(x)}</div>`).join('')}</div>`;
function sol(N){const al=[['Desayunos','des'],['Comidas','com'],['Cenas','cen']];
return`<div class="pg">${head('SOLICITUD DE VIÁTICOS PARA VIAJE GRUPO CGE',1)}${ident(1)}
<div class="sh">HOSPEDAJE</div><table class="t"><tr><td>${L('Precio por noche')}</td><td>${f('pn',{n:1})}</td><td>${L('Noches (o hab.)')}</td><td>${f('noches',{o:1})}</td><td>${L('Total')}</td><td>${A('hosp')}</td></tr><tr><td>${L('Hotel')}</td><td colspan="3" class="l">${f('hotel')}</td><td>${L('Incluye desayuno')}</td><td>${sel('incDes',['NO','SÍ'])}</td></tr></table>
<div class="sh">ALIMENTOS</div><table class="t"><tr><th>${T('Concepto')}</th><th>${T('Cantidad')}</th><th>${T('Tarifa')}</th><th>${T('Importe')}</th></tr>${al.map(([a,k])=>`<tr><td class="l">${L(a)}</td><td>${f(k,{o:1})}</td><td>${f('tarifa',{n:1})}</td><td>${A('i_'+k)}</td></tr>`).join('')}<tr><td class="l">${L('Total')}</td><td>${A('aln')}</td><td></td><td class="b">${A('al')}</td></tr></table>
<div class="sh">TRANSPORTE</div><table class="t"><tr><th>${T('Tipo')}</th><th>${T('Origen')}</th><th>${T('Destino')}</th><th>${T('Precio')}</th><th class="np"></th></tr>${S.tr.map((r,i)=>`<tr><td style="width:.9in">${sel(`tr/${i}/t`,TIPOS)}</td><td class="l">${f(`tr/${i}/o`)}</td><td class="l">${f(`tr/${i}/d`)}</td><td style="width:1in">${f(`tr/${i}/p`,{n:1})}</td><td class="np"><button data-x="t${i}">✕</button></td></tr>`).join('')}<tr><td colspan="3" class="r">${L('Total transporte')}</td><td class="b">${A('tr')}</td><td class="np"></td></tr></table><div class="np add"><button data-act="at">+ Tramo</button></div>
<div class="sh">OTROS</div><table class="t"><tr><th style="width:1.2in">${T('Monto')}</th><th>${T('Concepto')}</th><th class="np"></th></tr>${S.ot.map((r,i)=>`<tr><td>${f(`ot/${i}/m`,{n:1})}</td><td class="l">${f(`ot/${i}/c`)}</td><td class="np"><button data-x="o${i}">✕</button></td></tr>`).join('')||`<tr><td class="x">&nbsp;</td><td class="x"></td><td class="np"></td></tr>`}</table><div class="np add"><button data-act="ao">+ Concepto</button></div>
<div class="sh">RESUMEN</div><table class="t"><tr><td class="l">${L('Hospedaje')}</td><td>${A('hosp')}</td><td class="l">${L('Alimentos')}</td><td>${A('al')}</td></tr><tr><td class="l">${L('Movilidad (estimado general; vacío = suma de transporte)')}</td><td>${f('mov',{n:1,o:1})}</td><td class="l">${L('Otros')}</td><td>${A('ot')}</td></tr><tr><td colspan="3" class="r b">${L('TOTAL SOLICITADO')}</td><td class="b">${A('tot')}</td></tr></table>
${sig('Jefatura de Departamento','Dirección Administrativa','Dirección General')}
<p style="text-align:center;font-size:7pt">${L('NOTA:')} ${T('Favor de llenar digitalmente el formato, exportarlo y recabar firmas.')}</p>${foot('Solicitud',1,N)}</div>`}
const GR=[['HOSPEDAJE',['Estancia']],['ALIMENTOS',['Desayuno','Comida','Cena']],['TRANSPORTE',['AGS-DEST','DEST-AGS']],['TRASLADO',['Gasolina','Casetas']],['MOVILIDAD',['Mañana','Tarde','Noche']]],DN=['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO','DOMINGO'],rid=(g,r)=>g+'.'+r,v=k=>n(S.cm[k]);
function weeks(){if(!S.ini||!S.fin||P(S.fin)<P(S.ini))return[];let d=P(S.ini);d.setDate(d.getDate()-((d.getDay()+6)%7));const W=[];while(d<=P(S.fin)){const ds=[];for(let i=0;i<7;i++){ds.push(iso(d));d.setDate(d.getDate()+1)}W.push(ds)}return W}
function cmp(w,wi,N){const inR=d=>d>=S.ini&&d<=S.fin;let h=`<div class="pg">${head(`COMPROBACIÓN DE VIÁTICOS · SEMANA ${wi+1}`,0)}${ident(0)}<div class="sh">Captura los montos en las celdas amarillas</div>`;
GR.forEach(([nm,rs],g)=>{h+=`<table class="t" style="margin-top:6px"><tr><th class="sh" style="width:.85in">${nm}</th>${DN.map((x,i)=>`<th>${T(x)}<br><span class="a">${w[i].slice(8)}/${w[i].slice(5,7)}</span></th>`).join('')}<th>${T('SUBTOTAL')}</th><th>${T('IVA')}</th></tr>`;
rs.forEach((r,j)=>{h+=`<tr><td class="l">${T(r)}</td>${w.map(d=>inR(d)?`<td>${f('cm/'+rid(g,j)+'|'+d,{n:1,p:1})}</td>`:'<td class="x"></td>').join('')}<td>${A(`rk|${wi}|${rid(g,j)}`)}</td><td>${f(`cm/i|${rid(g,j)}|${w[0]}`,{n:1,p:1})}</td></tr>`});
h+=`<tr><td colspan="8" class="r">${L('SUMA:')}</td><td>${A(`gk|${wi}|${g}`)}</td><td>${A(`gl|${wi}|${g}`)}</td></tr></table>`});
return h+`<p class="r" style="margin-top:8px">${L('Subtotal de la semana:')} ${A('wk|'+wi)} &nbsp; ${L('IVA:')} ${A('wl|'+wi)}</p>${foot(`Comprobación · semana ${wi+1}`,wi+2,N)}</div>`}
function res(N){let h=`<div class="pg">${head('RESUMEN DE COMPROBACIÓN',0)}${ident(0)}<div class="sh">OTROS GASTOS COMPROBADOS</div><table class="t"><tr><th style="width:.4in">${T('#')}</th><th>${T('Concepto')}</th><th style="width:1in">${T('Fecha')}</th><th style="width:1in">${T('Monto')}</th><th style="width:.8in">${T('IVA')}</th></tr>`;
for(let i=0;i<5;i++)h+=`<tr><td>${T(i+1)}</td><td class="l">${f('cm/oc|'+i)}</td><td>${f('cm/of|'+i)}</td><td>${f('cm/om|'+i,{n:1})}</td><td>${f('cm/oi|'+i,{n:1})}</td></tr>`;
return h+`</table><div class="sh">BALANCE</div><table class="t"><tr><td class="l">${L('Cantidad entregada (total solicitado)')}</td><td>${A('ent')}</td></tr><tr><td class="l">${L('Cantidad comprobada (con IVA)')}</td><td>${A('comp')}</td></tr><tr><td class="l">${L('Cambio devuelto')}</td><td>${f('cambio',{n:1})}</td></tr><tr><td class="l b">${L('DIFERENCIA')}</td><td class="b">${A('dif')}</td></tr></table>
<p class="b" style="text-align:center;margin-top:8px">${A('msg')}</p>${sig('Firma de recepción de comprobación','Firma de aceptación de revisión')}${foot('Resumen de comprobación',N,N)}</div>`}
function upd(){const C=calc(),W=weeks(),t=n(S.tarifa),M={fecha:dmy(S.fecha),nom:S.nombre,dep:S.depto,mot:S.motivo,per:`${dmy(S.ini)} al ${dmy(S.fin)}`,dur:C.dias?`· ${C.dias} día(s), ${C.noches} noche(s)`:'',hosp:m$(C.hosp),al:m$(C.al),aln:C.des+C.com+C.cen,tr:m$(C.tr),ot:m$(C.ot),tot:m$(C.tot),i_des:m$(C.des*t),i_com:m$(C.com*t),i_cen:m$(C.cen*t),ent:m$(C.tot)};let tot=0;
W.forEach((w,wi)=>{let K=0,L=0;GR.forEach(([,rs],g)=>{let gk=0,gl=0;rs.forEach((_,r)=>{const k=w.reduce((s,d)=>s+v(`${rid(g,r)}|${d}`),0);gk+=k;gl+=v(`i|${rid(g,r)}|${w[0]}`);M[`rk|${wi}|${rid(g,r)}`]=m$(k)});M[`gk|${wi}|${g}`]=m$(gk);M[`gl|${wi}|${g}`]=m$(gl);K+=gk;L+=gl});M['wk|'+wi]=m$(K);M['wl|'+wi]=m$(L);tot+=K+L});
for(let i=0;i<5;i++)tot+=v('om|'+i)+v('oi|'+i);const d=C.tot-tot-n(S.cambio);M.comp=m$(tot);M.dif=m$(d);M.msg=d<-.005?'A FAVOR DEL EMPLEADO':d>.005?'PENDIENTE DE COMPROBACIÓN O REPOSICIÓN POR PARTE DEL EMPLEADO':'CUENTA CUADRADA';
document.querySelectorAll('[data-a]').forEach(e=>{const x=String(M[e.dataset.a]??'');if(e.textContent!==x)e.textContent=x});
document.querySelectorAll('[data-f]').forEach(e=>{const p=e.dataset.f,val=get(p);if(e.tagName=='INPUT'||e.tagName=='SELECT'){if(e!==document.activeElement&&e.value!=val)e.value=val??'';return}
const ov='o'in e.dataset,au=ov&&val==='';e.classList.toggle('a',au);e.classList.toggle('v',!au);if(e===document.activeElement)return;
let x=au?C[p]:val;if(x===''||x==null)x='';else if('n'in e.dataset)x='p'in e.dataset?(+x).toLocaleString('es-MX'):m$(x);if(e.textContent!==String(x))e.textContent=x});
try{localStorage.vtcge=JSON.stringify(S)}catch(x){}}
function render(){const W=S.cmpOn?weeks():[],N=1+W.length+(W.length?1:0),s=$('pv').scrollTop;$('pages').innerHTML=sol(N)+W.map((w,i)=>cmp(w,i,N)).join('')+(W.length?res(N):'');$('pv').scrollTop=s;$('cmpOn').checked=S.cmpOn;upd()}
document.addEventListener('input',e=>{const t=e.target,p=t.dataset.f;if(!p)return;let x;if(t.tagName=='INPUT'||t.tagName=='SELECT')x=t.value;else{x=t.textContent.trim();if('n'in t.dataset||(t.hasAttribute('data-o')&&p!='mov'&&x!=='')){const y=parseFloat(x.replace(/[$,\s]/g,''));x=isNaN(y)?'':y}}put(p,x);upd()});
document.addEventListener('change',e=>{if(e.target.type=='date'&&(e.target.dataset.f=='ini'||e.target.dataset.f=='fin'))render()});
document.addEventListener('focusin',e=>{const t=e.target,p=t.dataset.f;if(!t.isContentEditable||!p)return;if('n'in t.dataset){const x=get(p);t.textContent=x!==''?x:('o'in t.dataset?calc()[p]:'')}const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r)});
document.addEventListener('focusout',()=>setTimeout(upd,0));
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});
document.addEventListener('paste',e=>{if(e.target.isContentEditable){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});
document.addEventListener('click',e=>{const d=e.target.dataset,x=d.x;if(d.act=='at')S.tr.push({t:'TAXI',o:'',d:'',p:''});else if(d.act=='ao')S.ot.push({m:'',c:''});else if(x)(x[0]=='t'?S.tr:S.ot).splice(+x.slice(1),1);else return;render()});
$('cmpOn').onchange=()=>{S.cmpOn=$('cmpOn').checked;render()};$('col').onchange=()=>document.body.classList.toggle('col',$('col').checked);
$('pf').onclick=()=>{const C=calc(),days=weeks().flat().filter(d=>d>=S.ini&&d<=S.fin);if(!days.length)return alert('Primero elige las fechas del viaje.');
days.forEach((d,i)=>{if(i<C.noches)S.cm['0.0|'+d]=S.pn;if(i>=1&&i<=C.des)S.cm['1.0|'+d]=S.tarifa;if(i<C.com)S.cm['1.1|'+d]=S.tarifa;if(i<C.cen)S.cm['1.2|'+d]=S.tarifa});upd()};
$('nw').onclick=()=>{if(confirm('¿Empezar un viaje nuevo? Se conservan nombre y departamento.')){S=Object.assign(blank(),{nombre:S.nombre,depto:S.depto,pn:S.pn,tarifa:S.tarifa});render()}};
$('ex').onclick=()=>dl(new Blob([JSON.stringify(S)],{type:'application/json'}),'json');
$('im').onclick=()=>$('fi').click();$('fi').onchange=async e=>{try{S=Object.assign(blank(),JSON.parse(await e.target.files[0].text()));render()}catch(x){alert('Archivo no válido')}e.target.value=''};
const dl=(b,x)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`Viaticos_${(S.nombre||'CGE').replace(/\W+/g,'_')}_${S.ini||S.fecha}.${x}`;a.click()};
/* Exportar PDF: cada hoja se dibuja en un canvas (sin colores de edición) y se arma el PDF aquí mismo, sin librerías ni diálogo de impresión */
$('pr').onclick=async()=>{const b=$('pr');b.disabled=true;b.textContent='Generando…';try{const css=document.querySelector('style').textContent,CW=2040,CH=2640,imgs=[];
for(const p of document.querySelectorAll('.pg')){const c=p.cloneNode(true);c.style.margin='0';c.querySelectorAll('.np').forEach(e=>e.remove());c.querySelectorAll('[data-ph]').forEach(e=>e.removeAttribute('data-ph'));c.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
c.querySelectorAll('input,select').forEach(i=>{const s=document.createElement('span');s.textContent=i.type=='date'?dmy(i.value):i.value;i.replaceWith(s)});
const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="816" height="1056"><foreignObject width="816" height="1056"><div xmlns="http://www.w3.org/1999/xhtml"><style>${css}</style>${new XMLSerializer().serializeToString(c)}</div></foreignObject></svg>`;
const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);await im.decode();const cv=document.createElement('canvas');cv.width=CW;cv.height=CH;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,CW,CH);x.drawImage(im,0,0,CW,CH);
imgs.push(new Uint8Array(await(await new Promise(r=>cv.toBlob(r,'image/jpeg',.92))).arrayBuffer()))}
const enc=new TextEncoder(),parts=[],off=[];let len=0;const push=q=>{if(typeof q=='string')q=enc.encode(q);parts.push(q);len+=q.length},obj=(i,fn)=>{off[i]=len;push(`${i} 0 obj\n`);fn();push('\nendobj\n')},N=imgs.length;
push('%PDF-1.4\n');obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));obj(2,()=>push(`<</Type/Pages/Count ${N}/Kids[${imgs.map((_,i)=>`${3+i*3} 0 R`).join(' ')}]>>`));
imgs.forEach((q,i)=>{const o=3+i*3,c='q 612 0 0 792 0 0 cm /Im0 Do Q';obj(o,()=>push(`<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<</XObject<</Im0 ${o+2} 0 R>>>>/Contents ${o+1} 0 R>>`));obj(o+1,()=>push(`<</Length ${c.length}>>\nstream\n${c}\nendstream`));
obj(o+2,()=>{push(`<</Type/XObject/Subtype/Image/Width ${CW}/Height ${CH}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${q.length}>>\nstream\n`);push(q);push('\nendstream')})});
const xr=len,T=3*N+3;push(`xref\n0 ${T}\n0000000000 65535 f \n`);for(let i=1;i<T;i++)push(String(off[i]).padStart(10,'0')+' 00000 n \n');push(`trailer\n<</Size ${T}/Root 1 0 R>>\nstartxref\n${xr}\n%%EOF`);
dl(new Blob(parts,{type:'application/pdf'}),'pdf')}catch(e){alert('No se pudo generar el PDF: '+e.message)}b.disabled=false;b.textContent='Exportar PDF'};
render();
</script></body></html>
