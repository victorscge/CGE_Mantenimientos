<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="color-scheme" content="dark light"><title>Seguimiento de actividades</title>
<style>:root{--bg:#0D1117;--paper:#161B22;--line:#30363D;--ink:#E6EDF3;--muted:#8B949E;--accent:#4F8CFF;--danger:#F05D5E}@media(prefers-color-scheme:light){:root{--bg:#F3F5F8;--paper:#fff;--line:#D5DBE3;--ink:#1B2430;--muted:#5B6675;--accent:#2563EB;--danger:#D03B3B}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px system-ui,Segoe UI,Arial,sans-serif;padding:16px}
form{width:min(360px,100%);background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 22px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
h1{font-size:1.15rem;margin:0 0 4px}p{margin:0 0 16px;color:var(--muted);font-size:.9rem}
input{width:100%;min-height:46px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;min-height:46px;margin-top:12px;border:0;border-radius:9px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}#e{color:var(--danger);font-size:.88rem;min-height:1.3em;margin:10px 0 0}</style></head>
<body><form id="f" autocomplete="off"><h1>Seguimiento de actividades</h1><p>Acceso protegido. Escribe la contraseña.</p>
<input id="p" type="password" placeholder="Contraseña" autocomplete="current-password" autofocus aria-label="Contraseña"><button id="b" type="submit">Entrar</button><div id="e" role="alert"></div></form>

async function open(pw){
  const k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
  const t=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(t);
}
